<style>
/* Layout: app da telefono — testata fissa con stato file e bozze, una scheda alla volta, barra delle schede in basso */

  --warn: #9a6200;
  --warn-soft: #fbf0d9;
  --test: #7a3db8;

    --sea: #5cb8d6; --sea-soft: #12313d; --pos: #5fcf95; --pos-soft: #143425; --neg: #f08a7b; --neg-soft: #3a1c18;
    --warn: #f0b94e; --warn-soft: #3a2d12; --test: #c39af0; --test-soft: #2c1f3c;

}

  --sea: #5cb8d6; --sea-soft: #12313d; --pos: #5fcf95; --pos-soft: #143425; --neg: #f08a7b; --neg-soft: #3a1c18;

.btn.primary { background: var(--sea); color: #fff; border-color: var(--sea); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #06222c; } }
:root[data-theme="dark"] .btn.primary { color: #06222c; }

.skel { height: 64px; border-radius: 14px; background: linear-gradient(90deg, var(--card), var(--line), var(--card)); background-size: 200% 100%; animation: sh 1.4s infinite; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }

.cli-head { display: flex; align-items: center; gap: 10px; }
.cli-head .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cli-nome { margin: 0; font-size: 24px; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.row.srv { align-items: flex-start; }
.chk { width: 26px; height: 26px; flex: none; border-radius: 7px; border: 1.5px solid var(--muted); background: var(--card); color: #fff; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
.chk[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); }
.linkish { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.tag.yel { background: var(--warn-soft); color: var(--ink); }
.tag.teal { background: var(--pos-soft); color: var(--sea); }
.row.canc .t, .row.canc .v { text-decoration: line-through; color: var(--muted); }
.legenda { font-size: 12px; margin: 0 2px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.selbar { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 7; background: var(--ink); color: var(--bg); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }

<script>
(() => {
  "use strict";
  // ---------- costanti ----------
  const PONTE = { server: "n8n", workflowId: "WAb5AAGFwrTD6skZ", trigger: "Webhook conti" };
  const FILE = "prova";
  const MESI = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
  const MESI_LUNGHI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const STATI_PARTITA = ["Concordato", "Manca il prezzo", "Chiuso", "Chiuso / incluso", "Solo nostro gestionale", "Deciso solo da loro"];
  const STATI_CLIENTE = ["Da sollecitare", "Sollecitato", "Fatturato", "Da incassare", "Proposta", "Da decidere", "Da verificare", "Compensato", "Chiuso"];
  const OP_LABEL = { movimento: "Movimento", incasso_fattura: "Incasso fattura", partita: "Partita collega", cliente: "Cliente", subappalto: "Sub-appalto", servizio: "Servizio" };
  // Chi ha incassato un servizio passato a un collega (regola di Agostino 21/10): carta in cassa, link, bonifico, fattura = noi
  const INCASSA_NOI = ["Fattura", "Sconto in fattura", "Carta", "Link", "Bonifico", "Dalla struttura", "Uber"];
  const INCASSA_LORO = ["Contanti", "Incassare", "Al ritorno", "All'andata"];
  const chiIncassa = (mod) => (INCASSA_NOI.includes(mod) ? "Noi" : INCASSA_LORO.includes(mod) ? "Loro" : "");

  // ---------- stato ----------
  const st = {
    tab: "mese",
    mese: new Date().getMonth() + 1, // 0 = anno
    snap: null,
    letto: null,
    caricando: false,
    erroreLettura: null,
    bozze: [], // {id, ...op, stato, esito, dettaglio, creata}
    db: null,
    filtroClienti: "tutti",
    cerca: "",
    salvando: false,
    serv: null, // servizi mese per mese e sub-appalti (azione "servizi")
    caricandoServ: false,
    erroreServ: null,
    meseFatt: new Date().getMonth() + 1,
    vistaColleghi: "partite",
    filtroSub: "da valorizzare",
    vista: null, // "cliente" quando è aperta la scheda di un cliente
    cli: null,
  };
  try { const t = localStorage.getItem("conti.tab"); if (t) st.tab = t; } catch (e) {}
  try { const s = localStorage.getItem("conti.snap"); if (s) { const o = JSON.parse(s); st.snap = o.snap; st.letto = o.letto; } } catch (e) {}
  try { const s = localStorage.getItem("conti.serv"); if (s) st.serv = JSON.parse(s); } catch (e) {}

  // ---------- utilità ----------
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n = (x) => (typeof x === "number" && isFinite(x) ? x : Number(x) || 0);
  const eur0 = new Intl.NumberFormat("it-IT", { maximumFractionDigits: 0 });
  const eur2 = new Intl.NumberFormat("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = (x, dec) => (dec ? eur2 : eur0).format(Math.round(n(x) * (dec ? 100 : 1)) / (dec ? 100 : 1)) + " €";
  const fmtS = (x) => (n(x) > 0.5 ? "+" : "") + fmt(x);
  const cls = (x) => (n(x) > 0.5 ? "pos" : n(x) < -0.5 ? "neg" : "mut");
  const serialeAData = (s) => new Date(Date.UTC(1899, 11, 30) + n(s) * 86400000);
  const dataBreve = (s) => { if (!s) return ""; const d = serialeAData(s); return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", timeZone: "UTC" }); };
  const dataLunga = (s) => { if (!s) return ""; const d = serialeAData(s); return d.toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); };
  const oggiSeriale = () => { const d = new Date(); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000); };
  const isoAData = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000); };
  const dataAIso = (s) => serialeAData(s).toISOString().slice(0, 10);
  const parseImporto = (s) => { const t = String(s || "").trim().replace(/\s|€/g, ""); if (!t) return NaN; const v = Number(t.replace(/\./g, "").replace(",", ".")); return isFinite(v) ? Math.round(v * 100) / 100 : NaN; };
  const nuovoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function toast(msg) {
    const root = $("#toast-root");
    root.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toast._t); toast._t = setTimeout(() => (root.innerHTML = ""), 3200);
  }

  // ---------- ponte n8n (connettore) ----------
  async function chiamaPonte(body) {
    const mcp = await claude.use("mcp");
    if (!mcp) { const e = new Error("Il collegamento a n8n non è disponibile in questa vista."); e.code = "no_mcp"; throw e; }
    const avvio = await mcp.callTool(PONTE.server, "execute_workflow", {
      workflowId: PONTE.workflowId, executionMode: "production", triggerNodeName: PONTE.trigger,
      inputs: { webhookData: { method: "POST", body } },
    }, { cache: false });
    const execId = avvio && avvio.payload && avvio.payload.executionId;
    if (!execId) throw new Error("n8n non ha avviato il ponte.");
    for (let i = 0; i < 45; i++) {
      await sleep(i < 2 ? 2500 : 3000);
      const r = await mcp.callTool(PONTE.server, "get_workflow_execution", {
        workflowId: PONTE.workflowId, executionId: String(execId), includeData: true, nodeNames: ["Risultato"],
      }, { cache: false });
      const p = r && r.payload;
      const s = p && p.execution && p.execution.status;
      if (s === "success") {
        const run = p.data && p.data.resultData && p.data.resultData.runData && p.data.resultData.runData.Risultato;
        const j = run && run[0] && run[0].data && run[0].data.main && run[0].data.main[0] && run[0].data.main[0][0] && run[0].data.main[0][0].json;
        if (!j) throw new Error("Il ponte ha finito senza risposta.");
        return j;
      }
      if (s === "error" || s === "crashed" || s === "canceled") throw new Error("Il ponte si è fermato (" + s + "). Esecuzione n8n " + execId + ".");
    }
    throw new Error("Il ponte non ha risposto in tempo. Esecuzione n8n " + execId + ".");
  }
  function testoErrore(e) {
    const c = e && e.code;
    if (c === "server_not_connected") return "Il connettore n8n non è collegato: aggiungilo in claude.ai › Impostazioni › Connettori.";
    if (c === "needs_reauth") return "Il connettore n8n va ricollegato in claude.ai › Impostazioni › Connettori.";
    if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "Serve il tuo permesso per usare n8n da questa pagina. Premi Riprova e consenti.";
    if (c === "server_unavailable") return "n8n non risponde in questo momento. Riprova tra poco.";
    if (c === "no_mcp") return e.message;
    return (e && e.message) || "Errore sconosciuto.";
  }

  // ---------- modelli dai dati ----------
  function riepilogo() {
    const R = st.snap.riepilogo;
    const voce = (label) => { const r = R.find((x) => String(x[1]).trim() === label); return r ? { t: r[2], i: r[3], tot: r[4] } : { t: 0, i: 0, tot: 0 }; };
    const mesiIdx = R.findIndex((x) => String(x[1]).startsWith("MESI AFFIANCATI"));
    const mesi = [];
    for (let k = 0; k < 12; k++) { const r = R[mesiIdx + 2 + k] || []; mesi.push({ ricavi: n(r[2]), netti: n(r[3]), costi: n(r[4]), margine: n(r[5]) }); }
    const sistIdx = R.findIndex((x) => String(x[1]).startsWith("DA SISTEMARE"));
    const sist = [];
    for (let k = sistIdx + 2; k < sistIdx + 12 && R[k] && R[k][1]; k++) sist.push({ cat: R[k][1], righe: n(R[k][2]), come: R[k][5] });
    return { voce, mesi, sist };
  }
  function clienti() {

    S.righe.slice(1).forEach((r, i) => {
      if (!r[0]) return;
      out.push({ riga: S.primaRiga + 1 + i, nome: r[0], collega: r[1], daFatt: n(r[2]), corse: n(r[3]), fattAperte: n(r[4]), fee: n(r[5]), dallaStr: n(r[6]), partita: n(r[7]), saldo: n(r[8]), stato: r[9] || "", azione: r[10] || "", note: r[11] || "", sosp25: n(r[12]), fee25: n(r[13]) });
    });
    return out;
  }
  function fatture() {
    const F = st.snap.fatture; const out = [];
    F.righe.slice(1).forEach((r, i) => {
      if (!r[0] && !r[6]) return;
      out.push({ riga: F.primaRiga + 1 + i, num: String(r[0]), profilo: r[1], tipo: r[3], sdi: r[4], data: r[5], cliente: r[6], ragione: r[7], totale: n(r[10]), conta: n(r[14]), incassato: n(r[15]), residuo: n(r[16]), pagata: r[17], eta: r[18], sollecito: r[19], note: r[20] });
    });
    return out;
  }
  function partite() {
    const P = st.snap.partite; const out = [];
    P.righe.slice(1).forEach((r, i) => {
      if (!r[0]) return;
      out.push({ riga: P.primaRiga + 1 + i, collega: r[0], sezione: r[1], data: r[2], tratta: r[3], ospite: r[4], prezzo: r[5], fee: r[6], valore: n(r[7]), fonte: r[8], stato: r[9] || "", ok: r[10], note: r[11] });
    });
    return out;
  }
  function paghe() {
    const P = st.snap.paghe;
    const meseC3 = n(P[2] && P[2][2]);
    const topHead = P.findIndex((r) => r[0] === "Autista" && r[1] === "Tipo compenso");
    const top = {};
    for (let k = topHead + 1; k < P.length && P[k][0] !== "TOTALE"; k++) {
      const r = P[k]; if (!r[0]) continue;
      top[r[0]] = { tipo: r[1], giorni: n(r[2]), ore: n(r[3]), compenso: n(r[5]), spese: n(r[6]), dovuto: n(r[7]), pagato: n(r[8]), residuo: n(r[9]), daGen: n(r[10]), controllo: r[11] };
    }
    const mHead = P.findIndex((r) => r[0] === "Autista" && r[1] === "Gen");
    const matrice = [];
    for (let k = mHead + 1; k < P.length; k++) {
      const r = P[k]; if (!r[0] || r[0] === "TOTALE") continue;
      matrice.push({ nome: r[0], mesi: r.slice(1, 13).map(n), totale: n(r[13]) });
    }
    return { meseC3, top, matrice };
  }

  // Da fatturare di un mese = servizi SVOLTI di quel mese senza numero di fattura (riga per riga).
  // Il fatturato in più degli altri mesi non scala, i da svolgere restano fuori (regole di Agostino 21/10).
  function mesiCliente(nome) {
    const c = (st.serv && st.serv.mesi && st.serv.mesi[nome]) || {};
    return Object.keys(c).map(Number).sort((a, b) => a - b).map((m) => ({ m, ...c[m], daFatt: c[m].senzaFatt || 0 }));
  }
  function daFatturareMese(m) {
    if (!st.serv) return [];
    const sit = clienti();
    return Object.entries(st.serv.mesi).map(([nome, mm]) => {
      const o = mm[m]; if (!o) return null;
      const s = sit.find((c) => c.nome === nome);
      return { nome, ...o, daFatt: o.senzaFatt || 0, riga: s ? s.riga : null, stato: s ? s.stato : "" };
    }).filter((x) => x && x.daFatt > 0.5).sort((a, b) => b.daFatt - a.daFatt);
  }
  function subappalti() {
    if (!st.serv) return [];
    const scritti = Object.fromEntries((st.serv.sub || []).map((x) => [x.id, x]));
    const inBozza = Object.fromEntries(st.bozze.filter((b) => b.op === "subappalto" && b.p && b.stato !== "scritto").map((b) => [b.p.idServizio, { ...b.p, bozzaId: b.id }]));
    return st.serv.dati.map((d) => {
      const pz = String(d.note || "").match(/(\d+)\s*\/\s*(\d+)/);
      return { ...d, chiAuto: chiIncassa(d.modalita), pezzo: pz ? pz[1] + "/" + pz[2] : "", scritto: scritti[d.id] || null, bozza: inBozza[d.id] || null };

  // ---------- bozze ----------
  const BOZZE_LS = "conti.bozze.riserva";
  async function avviaBozze() {
    let db = null;
    try { db = await claude.use("db"); } catch (e) { db = null; }
    st.db = db;
    if (db) {
      db.collection("bozze").onSnapshot((snap) => {
        st.bozze = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.creata).localeCompare(String(b.creata)));
        render();
      }, () => { toast("Le bozze non si aggiornano: ricarica la pagina."); });
    } else {
      try { st.bozze = JSON.parse(localStorage.getItem(BOZZE_LS) || "[]"); } catch (e) { st.bozze = []; }
      render();
    }
  }
  async function salvaBozza(b) {
    if (st.db) { const { id, ...dati } = b; await st.db.collection("bozze").doc(id).set(dati); }
    else {
      const i = st.bozze.findIndex((x) => x.id === b.id);
      if (i >= 0) st.bozze[i] = b; else st.bozze.push(b);
      try { localStorage.setItem(BOZZE_LS, JSON.stringify(st.bozze)); } catch (e) {}
      render();
    }
  }
  async function togliBozza(id) {
    if (st.db) await st.db.collection("bozze").doc(id).delete();
    else { st.bozze = st.bozze.filter((x) => x.id !== id); try { localStorage.setItem(BOZZE_LS, JSON.stringify(st.bozze)); } catch (e) {} render(); }
  }
  async function aggiungiBozza(op, descr) {
    // i dati della modifica stanno in "p": cosi' lo stato della bozza non copre lo stato scelto (cliente, sub-appalto)
    const b = { id: nuovoId(), p: op, op: op.op, descr, stato: "bozza", esito: "", dettaglio: "", file: FILE, creata: new Date().toISOString() };
    await salvaBozza(b);
    toast("Messa nelle bozze: premi Salva tutto quando hai finito");
  }
  const daInviare = () => st.bozze.filter((b) => ["bozza", "bloccato", "rimandato", "in_invio"].includes(b.stato));

  async function salvaTutto() {
    if (st.salvando) return;
    let coda = daInviare();
    if (!coda.length) return;
    st.salvando = true; render();
    try {
      let giri = 0;
      while (coda.length && giri < 10) {
        giri++;
        const lotto = coda.slice(0, 6);
        for (const b of lotto) await salvaBozza({ ...b, stato: "in_invio" });
        const ops = lotto.map((b) => ({ ...b.p, id: b.id }));
        let j;
        try { j = await chiamaPonte({ azione: "scrivi", file: FILE, ops }); }
        catch (e) {
          // esito incerto: le bozze restano da inviare; il ponte riconosce quelle già scritte
          for (const b of lotto) await salvaBozza({ ...b, stato: "bozza", dettaglio: "Non so se è arrivata: " + testoErrore(e) + " Al prossimo Salva tutto il ponte controlla e non scrive due volte." });
          toast("Salvataggio interrotto: le bozze sono al sicuro");
          break;
        }
        if (!j.ok) {
          for (const b of lotto) await salvaBozza({ ...b, stato: j.bloccato ? "bloccato" : "bozza", dettaglio: j.errore || "Il ponte non ha scritto" });
          toast(j.bloccato ? "Il file è aperto in Excel: chiudilo e riprova" : "Il ponte non ha scritto: le bozze restano");
          break;
        }
        const byId = Object.fromEntries((j.esiti || []).map((e) => [e.id, e]));
        for (const b of lotto) {
          const e = byId[b.id];
          if (!e) { await salvaBozza({ ...b, stato: "bozza", dettaglio: "Nessuna risposta per questa bozza" }); continue; }
          const stato = e.esito === "gia_scritto" ? "scritto" : e.esito;
          await salvaBozza({ ...b, stato, esito: e.dove || "", dettaglio: e.esito === "gia_scritto" ? "Era già scritta: non ripetuta" : e.dettaglio || "", fatta: new Date().toISOString() });
        }
        if ((j.esiti || []).some((e) => e.esito === "bloccato")) { toast("Il file è aperto in Excel: chiudilo e riprova"); break; }
        await sleep(300);
        coda = daInviare().filter((b) => b.stato !== "bloccato");
      }
      const ok = st.bozze.filter((b) => b.stato === "scritto").length;
      if (ok) leggi();
    } finally {
      st.salvando = false; render();
    }
  }

        if (nota) { op.nota = nota; parti.push("nota"); }
        await aggiungiBozza(op, `${p.collega} · ${dataBreve(p.data)} ${p.tratta} · ${parti.join(", ")}`);
        chiudiSheet();
      });

  // ---------- scheda cliente: servizi con filtri, partita, recap ----------
  const FILTRI = {
    stato: { label: "Stato", vals: ["Svolto", "Da svolgere", "Cancellato"] },
    incasso: { label: "Incasso", vals: ["Incassati da noi", "Da incassare", "Sconto in fattura", "A fattura", "Dalla struttura"] },
    fattura: { label: "Fattura", vals: ["Fatturati", "Da fatturare", "Non fatturabili"] },
    tipo: { label: "Tipo", vals: ["Transfer", "Dispo", "Tour", "Tuk-tuk", "Uber", "Viator"] },
    chi: { label: "Chi l'ha fatto", vals: ["Nostro autista", "Dato a collega", "Ricevuto da collega"] },
    controlli: { label: "Da controllare", vals: ["Prezzo", "Doppione", "Dati mancanti", "Soldi", "Sub-appalto"] },
  };
  function classe(s) {
    const a = String(s.anomalia || "");
    const prezzoOk = s.prezzoOk === "Sì";
    const ctrl = [];
    if (!prezzoOk && (/prezzo/i.test(a) || Math.abs(s.scarto) > 0.5)) ctrl.push("Prezzo");
    if (/doppione/i.test(a) || s.doppione) ctrl.push("Doppione");
    if (/senza (nome|autista|cliente|data|modalit)/i.test(a)) ctrl.push("Dati mancanti");
    if (/cancellato con tariffa|senza incasso|senza prova|acconto/i.test(a)) ctrl.push("Soldi");
    if (/sub-appalto/i.test(a)) ctrl.push("Sub-appalto");
    const incasso = s.modalita === "Sconto in fattura" ? "Sconto in fattura" : s.modalita === "Dalla struttura" ? "Dalla struttura"
      : s.incassato > 0.5 ? "Incassati da noi" : s.residuo > 0.5 ? "Da incassare" : s.modalita === "Fattura" ? "A fattura" : "";
    const fattura = s.nFatt ? "Fatturati" : s.daFatt > 0.5 ? "Da fatturare" : "Non fatturabili";
    const chi = s.scambio === "Dato a collega" ? "Dato a collega" : s.scambio === "Ricevuto da collega" ? "Ricevuto da collega" : "Nostro autista";
    return { stato: s.stato, incasso, fattura, tipo: s.tipo, chi, controlli: ctrl };
  }
  // prezzo che vede il cliente: per i svolti il «Da fatturare €» della riga (col «Sconto in fattura» è il netto);

  function recapTesto(opzioni) {
    const c = st.cli;

    // regola 10/10: servizi prenotati del mese, cancellate comprese senza diciture; fuori i da svolgere e i gia' fatturati

    const pagatiPosto = tutti.filter((s) => s.stato === "Svolto" && !s.nFatt && !(s.daFatt > 0.005) && s.incassato > 0.5);
    const dentro = tutti.filter((s) => s.stato !== "Da svolgere" && !s.nFatt && !pagatiPosto.includes(s) && s.fatturabile !== "No" && !(s.stato === "Cancellato" && (!opzioni.cancellate || !(prezzoCliente(s) > 0))));

    const zero = tutti.filter((s) => s.stato !== "Da svolgere" && !s.nFatt && !pagatiPosto.includes(s) && !(prezzoCliente(s) > 0) && (s.stato !== "Cancellato" || opzioni.cancellate));

      <div class="card"><svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ricavi e margine per mese">${bars}</svg><div class="legend"><span><i style="background:var(--sea-soft);outline:1px solid var(--line)"></i>Ricavi</span><span><i style="background:var(--sea)"></i>Margine</span><span>Tocca un mese in alto per vederlo</span></div></div>
      <h2>Soldi · da inizio anno</h2>
      <div class="card rows">
        <button class="row" data-vai="fatture"><div class="main"><span class="t">Manca da fatturare</span><span class="s">servizi svolti senza fattura</span></div><div class="v">${fmt(voce("MANCA DA FATTURARE").tot)}</div></button>

        <div class="row"><div class="main"><span class="t">Contanti in mano agli autisti</span><span class="s">incassati e non ancora consegnati</span></div><div class="v">${fmt(voce("Contanti in mano agli autisti").tot)}</div></div>

      <div class="card rows">${Object.keys(per).length ? Object.entries(per).map(([col, arr]) => `<div class="groupttl">${esc(col)} · ${arr.length}</div>` + arr.map((d) => {

    const aperte = fatture().filter((f) => f.residuo > 0.5 && f.conta !== 0).sort((a, b) => n(b.eta) - n(a.eta));

  function render() {
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === st.tab ? "page" : "false"));

    if (st.snap) {
      const l = st.letto ? new Date(st.letto) : null;
      sd.textContent = `Excel al ${dataBreve(st.snap.datiAl)} · letto ${l ? l.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : ""}${st.caricando ? " · rileggo…" : ""}`;
    } else sd.textContent = st.caricando ? "Leggo l'Excel… (circa 20 secondi)" : "Dati non ancora letti";

    const v = $("#vista");
    let top = "";
    if (st.erroreLettura) top += `<div class="banner err" role="alert"><div>${esc(st.erroreLettura)}${st.snap ? " Vedi gli ultimi dati letti." : ""}</div><button class="btn" id="ban-riprova">Riprova</button></div>`;
    if (st.bozze.some((b) => b.stato === "errore")) top += `<div class="banner warn"><div>Alcune bozze non sono state scritte: apri le bozze per vedere perché.</div><button class="btn" id="ban-bozze">Apri</button></div>`;
    else if (daInviare().length && !st.salvando) top += `<div class="banner info"><div>${daInviare().length} modifiche in bozza, non ancora nell'Excel.</div><button class="btn primary" id="ban-salva">Salva tutto</button></div>`;
    if (st.salvando) top += `<div class="banner info"><div>Sto scrivendo nell'Excel… puoi continuare a guardare.</div></div>`;
    if (!st.snap) {
      v.innerHTML = top + (st.caricando ? `<div class="skel"></div><div class="skel"></div><div class="skel" style="height:140px"></div><p class="mut" style="text-align:center">Leggo il Riepilogo, i clienti, le partite, le fatture e le paghe dall'Excel.</p>` : `<div class="card empty">I numeri arrivano dall'Excel tramite n8n.<br><br><button class="btn primary" id="primo">Leggi i dati</button></div>`);
      const pb = $("#primo"); if (pb) pb.addEventListener("click", leggi);
    } else {
      const html = st.vista === "cliente" && st.cli ? vistaCliente() : { mese: vistaMese, clienti: vistaClienti, colleghi: vistaColleghi, autisti: vistaAutisti, fatture: vistaFatture }[st.tab]();
      const foc = document.activeElement && document.activeElement.id === "cerca";

    const r3 = $("#ban-salva"); if (r3) r3.addEventListener("click", salvaTutto);
  }

  // ---------- eventi ----------
  document.querySelector("nav.tabs").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-tab]"); if (!b) return;
    st.tab = b.dataset.tab; st.vista = null; try { localStorage.setItem("conti.tab", st.tab); } catch (e) {}
    render(); window.scrollTo(0, 0);
  });
  $("#vista").addEventListener("click", (ev) => {
    const t = ev.target.closest("button"); if (!t) return;
    if (t.dataset.mese !== undefined) { st.mese = Number(t.dataset.mese); render(); return; }
    if (t.dataset.vai) { st.tab = t.dataset.vai; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.fc) { st.filtroClienti = t.dataset.fc; render(); return; }
    if (t.dataset.vc) { st.vistaColleghi = t.dataset.vc; render(); return; }
    if (t.dataset.fs) { st.filtroSub = t.dataset.fs; render(); return; }
    if (t.dataset.mf) { st.meseFatt = Number(t.dataset.mf); render(); return; }
    if (t.id === "leggi-serv") { leggiServizi(); return; }
    if (t.dataset.sub !== undefined) { const d = subappalti().find((x) => x.id === t.dataset.sub); if (d) formSubappalto(d); return; }
    if (t.dataset.cli) { const c = clienti().find((x) => x.riga === Number(t.dataset.cli)); if (c) apriCliente(c.nome); return; }
    // scheda cliente
    const c = st.cli;
    if (t.id === "cli-indietro") { st.vista = null; render(); window.scrollTo(0, 0); return; }
    if (t.id === "cli-ricarica" || t.id === "cli-leggi") { caricaCliente(); return; }
    if (t.dataset.cm) { const m = Number(t.dataset.cm); const i = c.mesi.indexOf(m); if (i >= 0) { if (c.mesi.length > 1) c.mesi.splice(i, 1); } else c.mesi.push(m); c.mesi.sort((a, b) => a - b); c.dati = null; render(); caricaCliente(); return; }
    if (t.dataset.cf) { const [g, v] = t.dataset.cf.split("|"); const arr = (c.f[g] = c.f[g] || []); const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); c.aperto = "filtri"; render(); return; }
    if (t.id === "cli-azzera") { ev.preventDefault(); c.f = {}; render(); return; }
    if (t.id === "cli-recap") { apriRecap(); return; }
    if (t.id === "cli-partita") { partitaCliente(); return; }
    if (t.dataset.sel) { const r = Number(t.dataset.sel); const i = c.sel.indexOf(r); if (i >= 0) c.sel.splice(i, 1); else c.sel.push(r); render(); return; }
    if (t.dataset.srv) { const sv = c.dati.servizi.find((x) => x.riga === Number(t.dataset.srv)); if (sv) dettaglioServizio(sv); return; }
    if (t.id === "sel-via") { c.sel = []; render(); return; }
    if (t.id === "sel-fatt") { chiediFattura(); return; }
    if (t.id === "sel-ok") { (async () => { for (const r of c.sel) { const sv = c.dati.servizi.find((x) => x.riga === r); if (sv && sv.prezzoOk !== "Sì") await aggiungiBozza({ op: "servizio", riga: sv.riga, idServizio: sv.id, prezzoOk: "Sì" }, `${c.nome} · ${dataBreve(sv.data)} ${sv.da} · prezzo ok`); } c.sel = []; render(); })(); return; }
    if (t.id === "sel-nota") { notaMultipla(); return; }
    if (t.dataset.col) { dettaglioCollega(t.dataset.col); return; }
    if (t.dataset.aut) { dettaglioAutista(t.dataset.aut); return; }
    if (t.dataset.fat) { const f = fatture().find((x) => x.riga === Number(t.dataset.fat)); if (f) formIncasso(f); return; }
    if (t.id === "aut-pag") { formPagamento(); return; }
  });
  $("#vista").addEventListener("toggle", (ev) => { if (ev.target.id === "cli-filtri" && st.cli) st.cli.aperto = ev.target.open ? "filtri" : null; }, true);
  $("#vista").addEventListener("input", (ev) => { if (ev.target.id === "cerca") { st.cerca = ev.target.value; render(); } });
  $("#btn-aggiorna").addEventListener("click", leggi);
  $("#btn-bozze").addEventListener("click", pannelloBozze);

  render();
  avviaBozze();
  leggi();
})();
</script>
