  m.style.left = Math.max(6, Math.min(x + 14, window.innerWidth - 230)) + 'px';
  m.style.top = Math.max(6, y - 44) + 'px';
}
function plMsgOff() { var m = document.getElementById('plmsg'); if (m) m.style.display = 'none'; }
function plSpegni() {
  // toglie solo le classi di stato: riscrivere className cancellava plhrs
  // e il righello delle ore cambiava altezza sotto il dito
  var l = document.querySelectorAll('.pllane');
  for (var i = 0; i < l.length; i++) l[i].className = l[i].className.replace(/\s*pl(ok|no)\b/g, '');
  var t = document.getElementById('pltiles');
  if (t) t.className = t.className.replace(/\s*pldrop\b/g, '');
}
function plPulisci() { plSpegni(); plMsgOff(); }
function plRisali(n, cls) {
  while (n && n !== document.body) {
    if (n.id === cls) return n;
    if (n.className && typeof n.className === 'string' && (' ' + n.className + ' ').indexOf(' ' + cls + ' ') >= 0) return n;
    n = n.parentNode;
  }
  return null;
}
function plPrendi(ev, s, nodo, colore) {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  if (PL_PINCH || ev.isPrimary === false || PL_DRAG) return;
  var x0 = ev.clientX, y0 = ev.clientY, mosso = false, ghost = null, dove;
  function muovi(e) {
    if (PL_PINCH) { mosso = false; return; }
    if (!mosso) {
      if (Math.abs(e.clientX - x0) < 8 && Math.abs(e.clientY - y0) < 8) return;
      mosso = true;
      PL_ARM = null;
      ghost = document.createElement('div');
      ghost.className = 'plghost';
      ghost.style.background = colore;
      ghost.textContent = fmtMin(s.startMin) + ' · ' + (s.nome || s.da);
      document.body.appendChild(ghost);
      PL_DRAG = s.id;
      plDipingiPiazzole(s);
    }
    e.preventDefault();
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    ghost.style.display = 'none';
    var sotto = document.elementFromPoint(e.clientX, e.clientY);
    ghost.style.display = '';
    var lane = sotto ? plRisali(sotto, 'pllane') : null;
    var tray = sotto ? plRisali(sotto, 'pltiles') : null;
    plSpegni();
    if (tray) tray.className += ' pldrop';
    dove = undefined;
    if (lane && lane.getAttribute('data-v') !== null) {
      var veic = lane.getAttribute('data-v');
      var r = plVerifica(s, veic, true);
      lane.className += ' ' + (r.ok ? 'plok' : 'plno');
      plMsg(e.clientX, e.clientY, r.ok ? r.msg : (r.msg + ' — lo metto lo stesso'), !r.ok);
      // dove lasci la scheda, lì va: la app avvisa, non decide al posto tuo
      dove = veic;
    } else if (tray) {
      plMsg(e.clientX, e.clientY, 'Torna fra i da assegnare', false);
      dove = '';
    } else plMsgOff();
  }
  var finito = false;
  function molla() {
    if (finito) return;
    finito = true;
    nodo.removeEventListener('pointermove', muovi);
    nodo.removeEventListener('pointerup', molla);
    nodo.removeEventListener('pointercancel', molla);
    // anche sulla finestra: se il dito si alza fuori dalla app, o il blocco sparisce da
    // sotto (un aggiornamento dei dati ridisegna tutto), l'evento sul nodo non arriva mai
    // e senza questi la app restava con PL_DRAG acceso — cioè non si ridisegnava più
    window.removeEventListener('pointerup', molla, true);
    window.removeEventListener('pointercancel', molla, true);
    window.removeEventListener('blur', molla, true);
    plPulisci();
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    PL_DRAG = null;
    if (!mosso) { if (PL_PENNA) { plPennella(s); return; } plArma(s.id); return; }
    if (dove !== undefined && dove !== s.veicolo) plSposta(s, dove); else render();
  }
  if (nodo.setPointerCapture) { try { nodo.setPointerCapture(ev.pointerId); } catch (e) { } }
  nodo.addEventListener('pointermove', muovi);
  nodo.addEventListener('pointerup', molla);
  nodo.addEventListener('pointercancel', molla);
  window.addEventListener('pointerup', molla, true);
  window.addEventListener('pointercancel', molla, true);
  window.addEventListener('blur', molla, true);
}
/* Rete di sicurezza: qualunque cosa succeda, un trascinamento non deve poter restare

/* ---- zoom con due dita e con rotella+ctrl ---- */
function plDist(t) {
  var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy) || 1;
}
function plMezzo(t) { return (t[0].clientX + t[1].clientX) / 2; }
var PL_ZTIMER = null;
function plAggiungiZoomGesti(box, sc) {
  /* Sul Mac il pinch del trackpad arriva come rotella con ctrl premuto: se non lo
     prendiamo noi, zooma tutta la pagina. Ridisegno leggero durante il gesto e uno
     completo quando le dita si fermano, se no a ogni scatto si rifà tutto l'HTML. */
  box.addEventListener('wheel', function (e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    plZoomVerso(plPx(plScala()) * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX, true);
    clearTimeout(PL_ZTIMER);
    PL_ZTIMER = setTimeout(function () { render(); }, 180);
  }, { passive: false });
  box.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 2) return;
    PL_PINCH = { d: plDist(e.touches), px: plPx(plScala()), x: plMezzo(e.touches) };
  }, { passive: true });
  box.addEventListener('touchmove', function (e) {
    if (!PL_PINCH || e.touches.length !== 2) return;
    e.preventDefault();
    // ancorato al punto in mezzo alle due dita: quello che stringi resta dov'è
    plZoomVerso(PL_PINCH.px * (plDist(e.touches) / PL_PINCH.d), PL_PINCH.x, true);
  }, { passive: false });
  box.addEventListener('touchend', function () { if (PL_PINCH) { PL_PINCH = null; render(); } }, { passive: true });
}
/* Da tastiera, quando la Plancia è aperta: + ingrandisce, − riduce, 0 riadatta.
   Non ruba i tasti mentre si scrive in un campo o si compila la scheda. */
document.addEventListener('keydown', function (e) {
  if (TAB !== 'plancia' || e.ctrlKey || e.metaKey || e.altKey) return;
  var t = e.target, n = t && t.nodeName;
  if (n === 'INPUT' || n === 'TEXTAREA' || n === 'SELECT' || (t && t.isContentEditable)) return;
  if (e.key === '+' || e.key === '=') { e.preventDefault(); plZoom(1); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); plZoom(-1); }
  else if (e.key === '0') { e.preventDefault(); plZoom(0); }
});
function plRidisegnaScala() {
  // durante il pinch ridisegno solo le larghezze, senza rifare tutto l'HTML
  var sc = plScala(), px = plPx(sc), tot = (sc.m1 - sc.m0) * px;
  var g = document.getElementById('plgrid');
  if (!g) return;
  var lanes = g.querySelectorAll('.pllane');
  for (var i = 0; i < lanes.length; i++) lanes[i].style.width = Math.round(tot) + 'px';
  var b = g.querySelectorAll('[data-m0]');
  for (var j = 0; j < b.length; j++) {
    var n = b[j], a = +n.getAttribute('data-m0'), e = +n.getAttribute('data-m1');
    n.style.left = Math.round((a - sc.m0) * px) + 'px';
    if (e) {
      var minimo = n.className.indexOf('plslot') >= 0 ? 46 : (n.className.indexOf('plblk') >= 0 ? 34 : 3);
      n.style.width = Math.max(minimo, Math.round((e - a) * px)) + 'px';
    }
  }
}

}

function plFuori(id) { if (PL_DRAG || PL_PINCH) return; if (PL_HOVER === id) PL_HOVER = null; plMiniatura(); }

      : (quanti ? '✓ tocca una piazzola verde: ' + quanti + (quanti === 1 ? ' mezzo libero' : ' mezzi liberi')
        : '✕ nessun mezzo libero in questa fascia')) + (anteprima ? '' : '</div>')

function plPosizionaCard() {
  var c = document.getElementById('plcard');
  if (!c || c.style.display === 'none' || !PL_CARD_ID) return;
  var n = plNodoDi(PL_CARD_ID);
  var vw = window.innerWidth, vh = window.innerHeight;
  if (vw < 560) {
    // sul telefono la scheda è una striscia in basso: non copre mai le corsie che stai guardando

    c.style.bottom = '76px';
    return;
  }
  c.className = c.className.indexOf('plcpeek') >= 0 ? 'plcpeek' : '';
  c.style.bottom = 'auto';
  if (!n) { c.style.left = '12px'; c.style.top = '80px'; return; }
  var r = n.getBoundingClientRect(), w = c.offsetWidth, h = c.offsetHeight;
  // di fianco, non sotto: sotto il blocco ci sono le piazzole verdi e la scheda le coprirebbe
  var x = r.right + 12, y = Math.round(r.top - 6);
  if (x + w > vw - 8) x = r.left - w - 12;
  if (x < 8) {
    x = Math.max(8, Math.min(Math.round(r.left + r.width / 2 - w / 2), vw - w - 8));
    y = r.bottom + 10 + h < vh - 8 ? r.bottom + 10 : r.top - h - 10;

  c.style.left = Math.max(8, x) + 'px';
  c.style.top = Math.max(8, Math.min(y, vh - h - 8)) + 'px';

function renderPlancia() { return plCon(renderPlancia_); }
function renderPlancia_() {
  var m = document.getElementById('main');
  var vecchio = document.getElementById('plscroll');
  var scrollX = vecchio ? vecchio.scrollLeft : -1;
  var attivi = DATA.services.filter(function (s) { return !isCanc(s) && s.startMin >= 0; });
  if (!attivi.length) { m.innerHTML = '<div class="vuoto">Nessun servizio con orario per ' + fmtData(DATA.date) + '</div>'; return; }
  var sc = plScala(), px = plPx(sc), tot = (sc.m1 - sc.m0) * px;
  var armato = plArmato();
  var senza = attivi.filter(function (s) { return !s.veicolo; });
  var h = '';

  /* --- righe: un mezzo ciascuna, più quelli scritti a mano che non stanno in anagrafica --- */
  var righe = [], nascosti = 0, noti = {};

    noti[v.nome] = true;

    var mine = attivi.filter(function (s) { return s.veicolo === v.nome; });
    var r = armato ? plVerifica(armato, v.nome, true) : null;
    if (PL_SOLO && armato && r && !r.ok) return;
    righe.push({ nome: v.nome, v: v, mine: mine, esito: r });
  });
  // un mezzo scritto nel foglio ma assente dal tab Veicoli non deve far sparire il suo servizio
  var fuori = {};
  attivi.forEach(function (s) { if (s.veicolo && !noti[s.veicolo]) fuori[s.veicolo] = true; });
  Object.keys(fuori).forEach(function (nome) {
    righe.push({ nome: nome, v: { nome: nome, pax: 0, tipo: 'non in anagrafica' }, fuori: true,
      mine: attivi.filter(function (s) { return s.veicolo === nome; }), esito: null });
  });

  /* i mezzi che non possono lavorare (fermi, dati a noleggio, o presi fuori flotta)
     vanno in fondo: in alto resta quello su cui puoi davvero appoggiare un servizio */
  function plPeso(r) {
    if (r.fuori) return 2;
    if (r.v.fuoriServizio || r.v.inRent) return 1;
    return 0;
  }
  righe.forEach(function (r, i) { r._i = i; });
  righe.sort(function (a, b) { return plPeso(a) - plPeso(b) || a._i - b._i; });

  h += barraPend('plsalva');
  h += '<div class="plbar">'
    + '<div class="plzoom"><button onclick="plZoom(-1)" title="Riduci">−</button>'

    + (DUE && !plPronta() ? '<span class="plsolo1">carico domani…</span>' : '')
    + '</div>';

  h += plBarraAutisti();
  if (PL_PENNA) {
    h += '<div class="plarm plarmp">🖌 <b>' + esc(PL_PENNA) + '</b> in mano — tocca i servizi da dargli, '
      + 'ritocca lo stesso per toglierlo. Il mezzo non si tocca.'
      + '<button class="chip" style="border:none;margin-left:auto" onclick="plPosa()">posa</button></div>';
  }
  if (armato) {
    h += '<div class="plarm">🎯 <b>' + esc(armato.nome || armato.da) + '</b> parte alle <b>' + fmtMin(armato.startMin) + '</b>'
      + '<span class="plpiu"> · ' + fmtDur(plDurata(armato)) + ' stimata · ' + (armato.pax || '?') + ' pax</span>'
      + ' — <b>tocca una piazzola verde</b><span class="plpiu"> per assegnarlo, la rossa lo forza</span>'
      + '<button class="chip" style="border:none;margin-left:auto" onclick="plArma(null)">annulla</button></div>';
  } else if (!PL_PENNA) {
    /* sul telefono ogni riga di testo è una riga di corsie in meno: il di più sta

    /* il suggerimento sullo zoom non va nascosto sul telefono: è lì che serve, perché
       le due dita non le scopre nessuno da solo */
    h += '<p class="plhint">Tocca un servizio per vedere <b>dove può andare</b><span class="plpiu">, oppure trascinalo direttamente sulla riga del mezzo'
      + '</span> · <b>due dita</b> per lo zoom<span class="plpiu">'
      + (px < 0.9 ? ', <b>+</b> per leggere i nomi dentro i blocchi' : '') + '</span>.</p>';
  }

  /* Il vassoio dei da assegnare sta PRIMA della griglia nell'HTML: sul telefono deve
     essere la prima cosa che si vede, in cima, non in fondo a tutta la plancia (lì non
     lo trovava nessuno). Sul desktop torna a destra con grid-column, dov'era. */
  var vass = '<aside class="pltray' + (armato ? ' plridotto' : '') + '">'
    + '<h4>🅿️ Da assegnare <em>' + senza.length + '</em>'
    + (armato ? '<button class="chip plriapri" style="border:none" onclick="plArma(null)">▾ vedi l\'elenco</button>' : '')
    + '</h4><div class="pltiles" id="pltiles">';
  if (!senza.length) vass += '<div class="plvuoto">Tutti i servizi hanno un mezzo. 👌</div>';
  senza.slice().sort(function (a, b) { return a.startMin - b.startMin; }).forEach(function (s) {
    var quanti = 0, quantiNascosti = 0;
    DATA.veicoli.forEach(function (v) {
      if (!plVerifica(s, v.nome).ok) return;
      if (VEI_HIDE[v.nome]) quantiNascosti++; else quanti++;
    });
    vass += '<div class="pltile' + (PL_ARM === s.id ? ' plsel' : '') + (quanti ? '' : ' plzero')
      + (PL_PENNA && s.autista === PL_PENNA ? ' plmio' : '') + '" data-id="' + esc(s.id) + '">'
      + '<b>' + fmtMin(s.startMin) + ' <i class="plstima">≈ ' + fmtDur(plDurata(s)) + '</i></b>'
      + esc(s.nome || s.da) + (s.domani ? '<em class="pldomani">🌙 domani</em>' : '')
      + '<em>' + esc(s.da + ' → ' + s.per) + '</em>'
      + '<em>' + (s.pax || '?') + ' pax · ' + esc(s.autista || 'senza autista') + '</em>'
      + '<u class="' + (quanti ? 'ok' : 'no') + '">' + (quanti ? quanti + (quanti === 1 ? ' mezzo libero' : ' mezzi liberi') : 'nessun mezzo libero')
      + (quantiNascosti ? ' · ' + quantiNascosti + ' nascosti' : '') + '</u></div>';
  });
  vass += '</div></aside>';

  h += '<div class="plmain">' + vass + '<div class="plwrap"><div class="plscroll" id="plscroll"><div class="plgrid" id="plgrid">';
  /* riga delle ore */
  h += '<div class="plrow plhead"><div class="plrail"><b>Ora</b><span>' + ('0' + (sc.h0 % 24)).slice(-2) + ':00 › ' + ('0' + (sc.h1 % 24)).slice(-2) + ':00</span></div>'
    + '<div class="pllane plhrs" style="width:' + Math.round(tot) + 'px">';
  // il passo non lo decide solo lo zoom: due etichette non devono toccarsi
  var passo = 15, PASSI = [15, 30, 60, 120, 180, 240, 360, 720];
  for (var ip = 0; ip < PASSI.length; ip++) { passo = PASSI[ip]; if (passo * px >= 46) break; }
  var dom2 = plDomani();
  for (var mm = Math.ceil(sc.m0 / passo) * passo; mm <= sc.m1; mm += passo) {
    var xt = Math.round((mm - sc.m0) * px);
    // translateX(-50%) sul primo tick lo faceva tagliare dal bordo della corsia
    var cls = [];
    if (xt < 22) cls.push('plt0'); else if (xt > tot - 24) cls.push('plt9');
    if (mm >= 1440) cls.push('pldom');
    var testo = (mm === 1440 && dom2) ? '🌙 ' + fmtData(dom2) : fmtMin(mm);
    h += '<i' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + ' data-m0="' + mm
      + '" style="left:' + xt + 'px">' + testo + '</i>';
  }
  h += '</div></div>';

  function lane(mine, veic, esito, idx) {
    var srt = mine.slice().sort(function (a, b) { return a.startMin - b.startMin; });
    /* sotto-righe: due servizi sovrapposti si impilano, non si nascondono */
    var fine = [], riga = {}, k;
    srt.forEach(function (s) {
      for (k = 0; k < fine.length; k++) if (fine[k] <= s.startMin) break;
      if (k === fine.length) fine.push(0);
      fine[k] = plFine(s);
      riga[s.id] = k;
    });
    var nr = Math.max(fine.length, 1);
    /* Una fascia in cima alla corsia, riservata alle ore: dentro il blocco il testo è
       quasi sempre tagliato («06:…»), e sopra il blocco l'etichetta finiva coperta dal
       blocco stesso. Qui invece «07:00 → 08:10 · 42 km · 1h 10m» si legge sempre.
       La fascia c'è solo quando la corsia ha una riga sola: con i servizi impilati le
       etichette non saprebbero a quale blocco appartengono. */
    var banda = nr > 1 ? 0 : 14;
    var H = nr > 1 ? 32 : 38, alt = nr * H + (nr + 1) * 5 + banda;
    var cls = 'pllane';
    var b = '<div class="' + cls + '" data-v="' + esc(veic) + '" style="width:' + Math.round(tot) + 'px;height:' + alt + 'px">';
    for (var g = Math.ceil(sc.m0 / 60) * 60; g <= sc.m1; g += 60)
      b += '<div class="plgline" data-m0="' + g + '" style="left:' + Math.round((g - sc.m0) * px) + 'px"></div>';
    // dove finisce oggi e comincia domani: senza questa riga i due giorni si confondono
    if (sc.m0 < 1440 && sc.m1 > 1440)
      b += '<div class="plmezza" data-m0="1440" style="left:' + Math.round((1440 - sc.m0) * px) + 'px"></div>';

    /* piazzola: dove finirebbe il servizio armato su questo mezzo */
    if (esito && veic) {
      var L = Math.round((armato.startMin - sc.m0) * px), W = Math.max(46, Math.round(plDurata(armato) * px));
      // con la larghezza minima la piazzola dell'ultimo servizio finiva oltre il bordo
      // e l'etichetta "✓ ci sta" restava tagliata: la riporto dentro
      if (L + W > tot) L = Math.max(0, Math.round(tot) - W);
      var kSlot = esito.ok ? (esito.k === 'stretto' ? 'plsmid' : 'plsok') : 'plsno';
      b += '<div class="plslot ' + kSlot + '" data-m0="' + armato.startMin + '" data-m1="' + plFine(armato) + '"'
        + ' style="left:' + L + 'px;top:' + (banda + 4) + 'px;width:' + W + 'px;height:' + (alt - banda - 8) + 'px"'
        + ' onclick="plAssegnaIdx(' + idx + ')"'
        + (esito.ok ? '' : ' title="' + esc(esito.msg + ' — toccala per metterlo qui lo stesso') + '"')
        // l'etichetta può sporgere dalla piazzola, non dalla corsia: se contro il bordo
        // resterebbe tagliata tengo solo il segno, tanto il motivo sta nella colonna del mezzo
        + '><i>' + plEtichetta(esito, L + W / 2, tot) + '</i></div>';
    }
    /* fasce rosse dove due servizi si accavallano */
    var ov = [];
    for (var i = 0; i < srt.length; i++) for (var j = i + 1; j < srt.length; j++) {
      var a1 = Math.max(srt[i].startMin, srt[j].startMin), b1 = Math.min(plFine(srt[i]), plFine(srt[j]));
      if (b1 > a1) ov.push([a1, b1]);
    }
    ov.sort(function (x, y) { return x[0] - y[0]; });
    var un = [];
    ov.forEach(function (o) { var l = un[un.length - 1]; if (l && o[0] <= l[1]) l[1] = Math.max(l[1], o[1]); else un.push([o[0], o[1]]); });
    un.forEach(function (o) {
      b += '<div class="plov" data-m0="' + o[0] + '" data-m1="' + o[1] + '" style="top:' + banda + 'px;left:' + Math.round((o[0] - sc.m0) * px) + 'px;width:'
        + Math.max(3, Math.round((o[1] - o[0]) * px)) + 'px"><i>⚠ ' + fmtDur(o[1] - o[0]) + '</i></div>';
    });
    /* fra un servizio e l'altro: prima il viaggio per arrivare al pick-up,
       poi l'attesa vera. Un buco di 6 ore non è tutto tempo libero. */
    if (PL_GAP && nr === 1) {
      for (var q = 1; q < srt.length; q++) {
        var A = srt[q - 1], B = srt[q];
        var f = plFine(A), buco = B.startMin - f;
        if (buco < 10) continue;
        /* L'ora d'arrivo è quella VERA: fine del servizio + tragitto, sempre. Prima il
           tragitto veniva tagliato alla lunghezza del buco (`Math.min(tt.min, buco)`) e
           l'arrivo finiva per coincidere con l'inizio del servizio dopo: una bugia, e
           proprio nel caso peggiore — quello in cui il mezzo NON ci arriva. Il taglio
           serve solo a disegnare la barra, che non può sforare il buco. */
        var tt = trf(A.id, B.id);
        var arrivo = f + tt.min;                              // ora vera
        var via = Math.max(0, Math.min(tt.min, buco));        // solo per la barra
        var arrivoBarra = f + via;
        var attesa = Math.max(0, B.startMin - arrivo);
        var tardi = arrivo - B.startMin;                      // > 0 = non ci arriva
        var stretto = tt.min + tt.buffer > buco;
        var titolo = 'Finisce alle ' + fmtMin(f)
          + (tt.min ? ' · ' + fmtDur(tt.min) + (tt.km ? ' e ' + tt.km + ' km' : '') + ' per arrivare a ' + B.da + ' · sul posto alle ' + fmtMin(arrivo)
                    : ' · stesso posto, non si sposta')
          + (attesa > 0 ? ' · ' + fmtDur(attesa) + ' di attesa' : '')
          + ' · riparte alle ' + fmtMin(B.startMin)
          + (tardi > 0 ? ' — ci arriva ' + fmtDur(tardi) + ' DOPO che è già partito' : '')
          + (stretto && tardi <= 0 ? ' — margine sotto i ' + fmtDur(tt.buffer) : '');
        var top = banda + Math.round((alt - banda) / 2 - 8);
        var wv = Math.max(3, Math.round(via * px)), arrSopra = false;
        if (via > 0) {
          b += '<div class="plgap plgvia' + (stretto ? ' plgno' : '') + '" data-m0="' + f + '" data-m1="' + arrivo + '"'
            + ' style="left:' + Math.round((f - sc.m0) * px) + 'px;width:' + wv + 'px;top:' + top + 'px"'
            + ' title="' + esc(titolo) + '">'
            + (wv >= 62 ? '<i>🚗 ' + fmtDur(via) + '</i>' : '') + '</div>';
          /* L'ora in cui il mezzo è materialmente sul pick-up del servizio dopo. Va SOTTO
             la barra: la fine sta sopra, il viaggio in mezzo, l'arrivo sotto — così le tre
             cose si leggono in fila e non si accavallano mai, nemmeno quando il viaggio è
             una strisciolina di dieci pixel. Se dentro la barra non ci stanno i minuti,
             se li porta dietro questa etichetta. */
          /* L'ora in cui il mezzo è materialmente sul pick-up del servizio dopo. Prima la
             misuravo solo sull'attesa: con le catene strette l'attesa è zero e l'etichetta
             non compariva mai — proprio nei casi in cui serve saperlo. Ora lo spazio è
             TUTTO il buco: se dall'arrivo in poi non ci sta, si appoggia alla fine del
             buco, contro il blocco che segue. L'ora è scritta, la posizione è un di più. */
          var kmT = tt.km ? ' · ' + tt.km + ' km' : '';
          var rit = tardi > 0 ? ' ⚠ +' + fmtDur(tardi) : '';
          var tArr = plEtich(wv >= 62
            ? ['arrivo ' + fmtMin(arrivo) + rit + kmT, 'arrivo ' + fmtMin(arrivo) + rit, '▸' + fmtMin(arrivo) + rit]
            : ['arrivo ' + fmtMin(arrivo) + rit + ' · ' + fmtDur(tt.min) + kmT,
               'arrivo ' + fmtMin(arrivo) + rit + ' · ' + fmtDur(tt.min), 'arrivo ' + fmtMin(arrivo) + rit,
               '▸' + fmtMin(arrivo) + rit + ' ' + fmtDur(tt.min), '▸' + fmtMin(arrivo) + rit],
            buco * px);
          /* Se non ci arriva, l'ora vera si scrive comunque: il buco è stretto proprio
             perché la catena è rotta, e questo è l'unico caso in cui vale la pena che
             una scritta sbordi sul blocco che segue. In rosso, che è un allarme. */
          if (!tArr && tardi > 0) tArr = '▸' + fmtMin(arrivo) + ' ⚠ +' + fmtDur(tardi);
          if (tArr) {
            var largA = tArr.length * 5.4 + 10, mLab = arrivo;
            if ((B.startMin - mLab) * px < largA) mLab = Math.max(f, B.startMin - largA / px);
            b += '<div class="plora plarr' + (tardi > 0 ? ' pltardi' : '') + '" data-m0="' + Math.round(mLab)
              + '" style="left:' + Math.round((mLab - sc.m0) * px)
              + 'px;top:' + (top + 18) + 'px" title="' + esc(titolo) + '">' + tArr + '</div>';
            arrSopra = true;
          }
        }
        if (attesa > 0) {
          var wa = Math.max(3, Math.round(attesa * px));
          b += '<div class="plgap plgatt" data-m0="' + arrivoBarra + '" data-m1="' + B.startMin + '"'
            + ' style="left:' + Math.round((arrivoBarra - sc.m0) * px) + 'px;width:' + wa + 'px;top:' + top + 'px"'
            + ' title="' + esc(titolo) + '">'
            /* se l'ora d'arrivo è già scritta sopra — o se non ci si sposta, e allora è
               la stessa ora della fine — qui basta quanto si aspetta */
            + (wa >= 128 && !arrSopra && via > 0 ? '<i>⏳ ' + fmtDur(attesa) + ' · sul posto ' + fmtMin(arrivo) + '</i>'
              : (wa >= 54 ? '<i>⏳ ' + fmtDur(attesa) + '</i>' : '')) + '</div>';
        }
      }
    }
    /* L'ora in cui il servizio finisce, scritta subito dopo il blocco: sulla plancia
       si legge l'inizio e si indovina la fine. Si scrive solo se c'è spazio prima del
       blocco successivo, altrimenti si accavallerebbe con la sua ora di partenza. */
    if (nr === 1) {
      for (var qf = 0; qf < srt.length; qf++) {
        var S1 = srt[qf], S2 = srt[qf + 1];
        var fin1 = plFine(S1);
        if (S1.startMin < 0 || S1.startMin > sc.m1) continue;
        /* Lo spazio parte dal BLOCCO, non dalla sua fine: l'etichetta sta sopra il servizio
           e può allungarsi fino a dove comincia quello dopo. Dentro il blocco il nome è
           quasi sempre tagliato («06:…»): qui invece le ore si leggono sempre. */
        var spazio = ((S2 ? S2.startMin : sc.m1) - S1.startMin) * px;
        var kmS = S1.km ? ' · ' + S1.km + ' km' : '';
        var tFin = plEtich([
          fmtMin(S1.startMin) + ' → ' + fmtMin(fin1) + kmS + ' · ' + fmtDur(plDurata(S1)),
          fmtMin(S1.startMin) + ' → ' + fmtMin(fin1) + kmS,
          fmtMin(S1.startMin) + ' → ' + fmtMin(fin1),
          '→ ' + fmtMin(fin1),
          fmtMin(fin1)
        ], spazio);
        if (!tFin) continue;
        b += '<div class="plora plofin" data-m0="' + S1.startMin + '" style="left:' + Math.round((S1.startMin - sc.m0) * px)
          + 'px;top:1px"'
          + ' title="' + esc((S1.nome || S1.da) + ' · ' + fmtMin(S1.startMin) + ' → ' + fmtMin(fin1)
            + (S1.km ? ' · ' + S1.km + ' km' : '') + ' · ' + fmtDur(plDurata(S1))) + '">' + tFin + '</div>';
      }
    }
    srt.forEach(function (s) {
      var col = s.autista ? colorOf(s.autista) : '#8f9aa4';
      var male = veic && !plVerifica(s, veic).ok;
      var c = 'plblk' + (PEND[s.id] ? ' plpend' : '') + (male ? ' plbad' : '') + (!s.autista ? ' plnoaut' : '')
        + (PL_ARM === s.id ? ' plsel' : '') + (PL_PENNA && s.autista === PL_PENNA ? ' plmio' : '');
      var W2 = Math.max(px < 0.5 ? 12 : 34, Math.round(plDurata(s) * px));
      // sotto i 74 px il nome non ci sta: resta l'ora; sotto i 30 resta il colore
      c += W2 < 30 ? ' plxs' : (W2 < 74 ? ' plsm' : '');
      b += '<div class="' + c + '" data-id="' + esc(s.id) + '" data-m0="' + s.startMin + '" data-m1="' + plFine(s) + '"'
        + ' style="left:' + Math.round((s.startMin - sc.m0) * px) + 'px;width:' + W2 + 'px;top:'
        + (banda + 5 + riga[s.id] * (H + 5)) + 'px;height:' + H + 'px;background:' + col + '"'
        + ' title="' + esc((s.domani ? 'DOMANI ' : '') + fmtMin(s.startMin) + '–' + fmtMin(plFine(s)) + ' · ' + (s.nome || '') + ' · ' + s.da + ' → ' + s.per + ' · ' + (s.pax || '?') + ' pax · ' + (s.autista || 'senza autista')) + '">'
        + '<b>' + fmtMin(s.startMin) + ' ' + esc(s.autista || 'senza autista') + (male ? ' ⚠' : '') + '</b>'
        + '<span>' + esc((s.nome || s.da) + ' → ' + s.per) + '</span></div>';
    });
    if (DATA.nowMin >= sc.m0 && DATA.nowMin <= sc.m1)
      b += '<div class="plnow" data-m0="' + DATA.nowMin + '" style="left:' + Math.round((DATA.nowMin - sc.m0) * px) + 'px"></div>';
    return b + '</div>';
  }

  /* togliendo il servizio dal mezzo su cui sta adesso, cosa guadagna quel giro:
     è il motivo per cui si sposta un servizio, e senza questa riga non si vedeva */
  var liberato = '';
  if (armato && armato.veicolo) {
    var lib = plCatena(armato, '').liberati[0];
    if (lib && lib.guadagno > 0) liberato = 'si libera: ' + (lib.srv.nome || lib.srv.da) + ' delle '
      + fmtMin(lib.srv.startMin) + ' +' + fmtDur(lib.guadagno)
      + (lib.era === 'rotto' && lib.diventa !== 'rotto' ? ' e torna raggiungibile' : '');
  }

  PL_RIGHE = righe;
  var sepFatta = false;
  righe.forEach(function (r, k) {
    if (!sepFatta && plPeso(r) > 0) {
      sepFatta = true;
      h += '<div class="plsep"><b>fermi, a noleggio o fuori flotta</b> — ci puoi mettere un servizio lo stesso, ma sai cosa stai facendo</div>';
    }
    var srt = r.mine.slice().sort(function (a, b) { return a.startMin - b.startMin; });
    var nOv = 0;
    for (var i = 0; i < srt.length; i++) for (var j = i + 1; j < srt.length; j++)
      if (srt[j].startMin < plFine(srt[i])) nOv++;
    var occ = 0; r.mine.forEach(function (s) { occ += plDurata(s); });
    var stato = r.fuori ? ' · non in anagrafica' : (r.v.fuoriServizio ? ' · fuori servizio' : (r.v.inRent ? ' · a noleggio' : ''));
    var kr = r.esito ? (r.esito.ok ? (r.esito.k === 'stretto' ? 'mid' : 'ok') : 'no') : '';
    var cl = 'plrow' + (nOv ? ' plovl' : '') + (r.fuori ? ' plfuori' : '')
      + (kr ? (kr === 'ok' ? ' plcanok' : (kr === 'mid' ? ' plcanmid' : ' plcanno')) : '');
    h += '<div class="' + cl + '"><div class="plrail"><b>' + esc(r.nome) + (nOv ? ' <em class="plwarn">⚠ ' + nOv + '</em>' : '') + '</b>'
      + '<span>' + (r.v.pax ? r.v.pax + ' posti' : esc(r.v.tipo || '')) + stato + ' · ' + (occ ? fmtDur(occ) : 'fermo') + '</span>'
      + (r.esito ? '<em class="plbadge ' + kr + '" title="' + esc(r.esito.msg) + '">' + plSegnoK(r.esito) + ' ' + esc(r.esito.breve) + '</em>' : '')
      // sulla riga da cui il servizio se ne va: quanto respira il giro togliendolo di lì
      + (liberato && armato && r.nome === armato.veicolo ? '<em class="plfree">🅿️ ' + esc(liberato) + '</em>' : '')
      + '</div>' + lane(r.mine, r.nome, r.esito, k) + '</div>'
      + (r.esito && r.esito.valle ? '<div class="plavv ' + (r.esito.valle.indexOf('⚠️') === 0 ? 'rotto' : 'stretto') + '">'
          + esc(r.nome) + ' — ' + esc(r.esito.valle) + '</div>' : '');
  });
  h += '<div class="plrow plnone"><div class="plrail"><b>Da assegnare</b><span>' + senza.length + (senza.length === 1 ? ' servizio' : ' servizi') + '</span></div>'
    + lane(senza, '', null, -1) + '</div>';
  h += '</div></div></div>';

  h += '</div>';

  m.innerHTML = h;

  /* Sul telefono il vassoio si appiccica sotto l'intestazione, che è a sua volta
     appiccicata in cima: l'altezza vera si misura, non si indovina (cambia con la
     larghezza e con la barra della data che va a capo). */
  var intest = document.querySelector('header');
  if (intest) document.documentElement.style.setProperty('--plsotto',
    Math.round(intest.getBoundingClientRect().height) + 'px');

  /* aggancio gli eventi dopo aver scritto l'HTML */
  function aggancia(sel) {
    var n = document.querySelectorAll(sel);
    for (var i = 0; i < n.length; i++) (function (nodo) {
      var id = nodo.getAttribute('data-id'), s = null;
      DATA.services.forEach(function (x) { if (x.id === id) s = x; });
      if (!s) return;
      var col = s.autista ? colorOf(s.autista) : '#8f9aa4';
      nodo.addEventListener('pointerdown', function (e) { plPrendi(e, s, nodo, col); });
      nodo.addEventListener('dblclick', function () { plApriServizio(s.id); });
      nodo.addEventListener('mouseenter', function () { plSopra(s.id); });
      nodo.addEventListener('mouseleave', function () { plFuori(s.id); });
    })(n[i]);
  }
  aggancia('.plblk');
  aggancia('.pltile');
  var box = document.getElementById('plscroll');
  if (box && !PL_PX && !PL_MISURATO && !PL_RIFATTO && box.scrollWidth > box.clientWidth + 2) {
    // al primo disegno la colonna dei mezzi non esisteva ancora e la misura era teorica:
    // ora che è a schermo rifaccio UNA volta, e poi basta — rifarlo a ogni tocco costava
    // il doppio del disegno su una flotta vera
    PL_MISURATO = true;
    PL_RIFATTO = true; renderPlancia_(); PL_RIFATTO = false; return;
  }
  if (box) {
    plAggiungiZoomGesti(box, sc);
    if (armato) box.scrollLeft = Math.max(0, (armato.startMin - sc.m0) * px - box.clientWidth / 2 + 60);
    else if (scrollX >= 0) box.scrollLeft = scrollX;
    if (!box.getAttribute('data-card')) {
      box.setAttribute('data-card', '1');
      box.addEventListener('scroll', plPosizionaCard);
    }
  }
  plMiniatura();
}


/* ---------- vista rent ---------- */
function renderRent(){
  var m=document.getElementById('main');
  var rents=DATA.rents||[];
  if(!rents.length){m.innerHTML='<div class="vuoto">Nessun noleggio attivo il '+DATA.date+'</div>';return;}
  var h='<div class="sommario"><span><b>'+rents.length+'</b> noleggi attivi</span></div>';
  rents.forEach(function(r){
    h+='<div class="card" style="border-left-color:var(--oro)">'
      +'<div class="top"><span style="font-size:16px;font-weight:700;color:var(--blu)">🔑 '+esc(r.veicolo||'—')+'</span>'
      +'<span class="chip">'+r.durata+' gg</span></div>'
      +'<div class="info">'+(r.nome?'👤 '+esc(r.nome):'')+(r.fornitore?' · 🏨 '+esc(r.fornitore):'')+'</div>'
      +'<div class="meta">'
      +'<span class="chip">dal '+fmtData(r.inizio)+' al '+fmtData(r.fine)+'</span>'
      +(r.prezzo?'<span class="chip">'+esc(r.prezzo)+'/giorno</span>':'')
      +(r.totale?'<span class="chip verde">tot '+esc(r.totale)+'</span>':'')
      +'</div></div>';
  });
  m.innerHTML=h;
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* Il messaggino si mette sempre SOPRA la barra gialla del salvataggio, misurandola: sul
   telefono un messaggio lungo va a capo tre volte e, a quota fissa, le finiva addosso —
   e la barra coperta vuol dire assegnazioni che non si salvano. */
function toast(t){
  var e=document.getElementById('toast');
  e.textContent=t;
  var b=document.querySelector('.plsalva');
  e.style.bottom=b?(Math.round(window.innerHeight-b.getBoundingClientRect().top)+12)+'px':'';
  e.style.display='block';
  setTimeout(function(){e.style.display='none';},3500);
}

/* avvio veloce: prima i dati incorporati nella pagina, poi l'ultima schermata
   salvata sul telefono, e solo come ultima spiaggia la chiamata classica */
document.getElementById('datePick').value=oggiLocal();
(function(){
  if(BOOT&&BOOT.services){
    DATA=BOOT;
    PLANS[BOOT.date]=BOOT;
    document.getElementById('datePick').value=BOOT.date;
    render();
    load(true); // riallinea in sottofondo e avvia il timer
    return;
  }
  var cached=null;
  try{cached=JSON.parse(localStorage.getItem('te_plan')||'null');}catch(e){}
  if(cached&&cached.services){
    DATA=cached;
    document.getElementById('datePick').value=cached.date;
    render();
    toast('📡 Aggiorno i dati…');
    load(true);
    return;
  }
  load();
})();
</script>
