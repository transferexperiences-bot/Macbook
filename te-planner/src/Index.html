<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--blu:#0b3d66;--oro:#c9a227;--verde:#1e8e3e;--rosso:#c5221f;--ambra:#e37400;--grigio:#5f6368;--bg:#f4f6f8;
  --bordo:#dadce0;--card:#ffffff;--testo:#202124;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
body{background:var(--bg);color:#202124;padding-bottom:70px;}
header{background:var(--blu);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:10;}
header h1{font-size:17px;font-weight:600;}
.datebar{display:flex;gap:6px;margin-top:10px;align-items:center;}
.datebar button{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:17px;width:38px;height:38px;border-radius:8px;flex-shrink:0;}
.datebar input{flex:1;min-width:0;height:38px;border:none;border-radius:8px;padding:0 8px;font-size:14px;}
.datebar .oggi{width:auto;padding:0 10px;font-size:13px;font-weight:600;background:var(--oro);color:#222;}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:10;}
.tabs button{flex:1;padding:12px 0 max(12px,env(safe-area-inset-bottom));border:none;background:none;font-size:12px;color:var(--grigio);}
.tabs button.att{color:var(--blu);font-weight:700;}
main{padding:12px;}
.sommario{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:12.5px;}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid var(--verde);}
.card.warn{border-left-color:var(--rosso);}
.card .top{display:flex;justify-content:space-between;align-items:baseline;}
.card .ora{font-size:19px;font-weight:700;color:var(--blu);}
.card .ora small{font-weight:400;color:var(--grigio);}
.card .tratta{font-size:14.5px;margin:5px 0 2px;font-weight:600;}
.card .info{font-size:12.5px;color:var(--grigio);margin-bottom:6px;}
.card .meta{font-size:12px;color:var(--grigio);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.card .extra{font-size:12.5px;color:var(--grigio);margin-top:7px;border-top:1px solid #f0f2f5;padding-top:6px;}
.azioni{display:flex;gap:8px;margin-left:auto;}
.azioni a{text-decoration:none;font-size:16px;background:#eef1f4;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.chip{background:#eef1f4;border-radius:20px;padding:2px 9px;font-size:12px;}
.chip.rosso{background:#fce8e6;color:var(--rosso);font-weight:600;}
.chip.verde{background:#e6f4ea;color:var(--verde);font-weight:600;}
.chip.ambra{background:#fef3e0;color:var(--ambra);font-weight:600;}
.vuoto{text-align:center;color:var(--grigio);padding:40px 20px;font-size:14px;}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;}
.modal{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:21;display:none;max-height:88vh;overflow-y:auto;padding:16px 16px max(20px,env(safe-area-inset-bottom));}
.modal h2{font-size:16px;color:var(--blu);margin-bottom:2px;}
.modal .sub{font-size:13px;color:var(--grigio);margin-bottom:12px;}
.modal label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;}
.modal select,.modal input[type=text],.modal input[type=date],.modal input[type=time],.modal input[type=number],.modal textarea{width:100%;height:44px;font-size:15px;border:1px solid #ccc;border-radius:10px;padding:0 10px;background:#fff;}
.modal textarea{height:70px;padding:8px 10px;}
.avviso{font-size:13px;border-radius:8px;padding:8px 10px;margin-top:6px;display:none;}
.avviso.ambra{background:#fef3e0;color:var(--ambra);display:block;}
.avviso.rosso{background:#fce8e6;color:var(--rosso);display:block;}
.btnrow{display:flex;gap:8px;margin-top:14px;}
.btnrow button{flex:1;height:44px;border:none;border-radius:10px;font-size:14px;font-weight:600;}
.salva{background:var(--blu);color:#fff;}
.annulla{background:#eef1f4;color:#333;}
.fl{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.fl .riga{display:flex;justify-content:space-between;align-items:center;}
.fl .nome{font-weight:600;font-size:15px;}
.fl .cat{font-size:11px;color:var(--grigio);}
.fl .st{font-size:13px;text-align:right;}
.bar{height:6px;background:#eef1f4;border-radius:4px;margin-top:8px;overflow:hidden;display:none;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ambra),var(--rosso));border-radius:4px;}
.clessidra{display:inline-block;animation:flip 2.5s infinite;}
@keyframes flip{0%,80%{transform:rotate(0)}90%,100%{transform:rotate(180deg)}}
.sez{font-size:13px;font-weight:700;color:var(--grigio);margin:16px 4px 8px;text-transform:uppercase;}
.sez.sub{font-size:12px;margin:14px 4px 6px;letter-spacing:.3px;}
.tl{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tlbar{position:relative;height:24px;background:#f0f2f5;border-radius:6px;margin:7px 0 2px;overflow:visible;}
.tlseg{position:absolute;top:3px;bottom:3px;}
.tlnow{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rosso);z-index:2;}
.tlassi{display:flex;justify-content:space-between;font-size:10px;color:#9aa0a6;}
.tltesto{font-size:12px;color:var(--grigio);margin-top:5px;line-height:1.6;}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--grigio);background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;}
.legenda span{display:flex;align-items:center;gap:5px;}
.sw{display:inline-block;width:16px;height:10px;border-radius:3px;}
.risultato{background:#fff;border:1px solid #e4e7eb;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:30;display:none;max-width:90vw;}
.spin{border:3px solid #eee;border-top-color:var(--blu);border-radius:50%;width:28px;height:28px;animation:sp 1s linear infinite;margin:40px auto;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============================================================
   SCHEDA ASSEGNA — a sinistra i giri per autista, a destra la coda per ora.
   Su telefono le due colonne stanno una sotto l'altra (prima la coda: è quella
   su cui si agisce); da 980px in su affiancate, con la coda che resta ferma
   mentre si scorrono i giri.
   ============================================================ */
/* su telefono prima la coda (è quella su cui si agisce), i giri sotto */
.assegna{display:flex;flex-direction:column;gap:14px;}
.assegna .coda{order:-1;}
/* i due bottoni per passare da una colonna all'altra sul telefono */
.assswitch{display:flex;gap:6px;margin-bottom:10px;}
.assswitch button{flex:1;border:1px solid #dbe2e9;background:#fff;color:var(--grigio);
     border-radius:10px;padding:10px 6px;font-size:13px;font-weight:600;}
.assswitch button.att{background:var(--blu);border-color:var(--blu);color:#fff;}
.assswitch button b{background:rgba(255,255,255,.25);border-radius:20px;padding:0 7px;}
.assswitch button:not(.att) b{background:#fce8e6;color:var(--rosso);}
.tornaCoda{border:none;background:var(--blu);color:#fff;border-radius:20px;
     padding:3px 10px;font-size:11.5px;font-weight:700;margin-right:2px;}
/* niente sticky: sotto l'intestazione blu sparirebbe a metà */
.selBanner{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
     background:#fffbe9;border:1px solid var(--oro);color:#8a6d0b;border-radius:9px;
     padding:7px 10px;margin-bottom:9px;font-size:12.5px;}
.pane{min-width:0;}
.paneT{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--blu);
       background:#e8eef4;border-radius:8px;padding:7px 11px;margin-bottom:9px;}
.paneT.sub{margin-top:14px;background:#f2f0e6;color:#7a6a1f;}
.paneN{background:var(--blu);color:#fff;border-radius:20px;padding:0 8px;font-size:11px;line-height:18px;}
.paneT.sub .paneN{background:#7a6a1f;}
.paneSel{font-weight:600;color:var(--grigio);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.giriPie{margin-top:10px;text-align:center;}

/* --- blocco autista --- */
.autbox{background:#fff;border-radius:10px;border-left:4px solid #9aa0a6;padding:8px 10px;
        margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.autT{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.autNome{font-weight:700;font-size:14px;}
.autCat{font-size:10.5px;color:var(--grigio);background:#eef1f4;border-radius:20px;padding:1px 7px;}
.autN{font-size:11.5px;color:var(--grigio);}
.autT>.chip,.autT>button{margin-left:auto;}
.autV{font-size:12px;margin-top:5px;border-radius:7px;padding:4px 8px;background:#eef1f4;color:var(--grigio);}
.autbox.v-ok{background:#f4fbf6;}      .autbox.v-ok .autV{background:#e6f4ea;color:var(--verde);font-weight:600;}
.autbox.v-stretto .autV{background:#fef3e0;color:var(--ambra);font-weight:600;}
.autbox.v-fermo .autV{background:#eceff2;color:#5f6368;}
.autbox.v-libero .autV{background:#f1f3f5;color:#78808a;}
.autbox.v-no{opacity:.75;}             .autbox.v-no .autV{background:#fce8e6;color:var(--rosso);}
.autbox.v-off{opacity:.6;}             .autbox.v-off .autV{background:#f1f3f5;color:#9aa0a6;}

/* --- riga di servizio dentro il giro --- */
.srvmini{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 6px;margin-top:4px;
         border-radius:7px;background:#f6f8fa;}
.srvmini b{color:var(--blu);white-space:nowrap;}
.srvT{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333;}
.srvmini.ghost{background:#fffbe9;border:1px dashed var(--oro);flex-wrap:wrap;}
.srvmini.ghost b{color:#8a6d0b;}
.ghostM{width:100%;font-size:11px;color:#8a6d0b;font-weight:600;}
.srvvuoto{font-size:11.5px;color:#9aa0a6;padding:5px 6px;}
.divario{font-size:10.5px;font-weight:600;padding:2px 8px 0;}

/* --- scheda della coda --- */
.ccard{background:#fff;border-radius:10px;border-left:4px solid var(--rosso);padding:9px 11px;
       margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.ccard.mezzo{border-left-color:var(--ambra);}
.ccard.sel{border-left-color:var(--oro);box-shadow:0 0 0 2px var(--oro),0 2px 8px rgba(201,162,39,.28);background:#fffdf5;}
.ccT{display:flex;align-items:center;gap:8px;font-size:13px;}
.ccT b{color:var(--blu);}
.ccEuro{margin-left:auto;font-weight:600;color:var(--grigio);font-size:12px;}
.ccTratta{font-size:13.5px;font-weight:600;margin:4px 0 2px;}
.ccInfo{font-size:11.5px;color:var(--grigio);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ccBtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.ccWhy{font-size:11.5px;color:var(--grigio);margin-top:4px;}
.ccPie{display:flex;align-items:center;gap:8px;font-size:11px;color:#9aa0a6;margin-top:6px;
       border-top:1px solid #f0f2f5;padding-top:5px;}

/* telefono e tablet stretto: una colonna per volta, quella scelta con i due bottoni */
@media(max-width:979px){
  body[data-tab="assegna"][data-ass="coda"] .assegna .giri{display:none;}
  body[data-tab="assegna"][data-ass="giri"] .assegna .coda{display:none;}
  /* il servizio scelto è già ripetuto per intero nella striscia gialla sotto */
  .giri .paneT .paneSel{display:none;}
}
@media(min-width:980px){
  .assswitch,.tornaCoda{display:none;}
  body[data-tab="assegna"] .assegna{display:grid;grid-template-columns:1.15fr 1fr;gap:0 18px;align-items:start;}
  body[data-tab="assegna"] .giri{grid-column:1;grid-row:1;}
  body[data-tab="assegna"] .coda{grid-column:2;grid-row:1;position:sticky;top:104px;
      max-height:calc(100vh - 130px);overflow-y:auto;padding-right:4px;}
}
/* cinque schede: su schermo stretto le scritte non devono più stare larghe della barra */
@media(max-width:520px){
  .tabs button{font-size:11px;padding:11px 0 max(11px,env(safe-area-inset-bottom));}
}

/* ============================================================
   DESKTOP — la app nasce per il telefono: senza questo blocco su un monitor
   il contenuto si stira per tutta la larghezza, le righe diventano lunghissime
   e la barra dei tab resta incollata in fondo allo schermo.
   ============================================================ */
[onclick]{cursor:pointer;}
.dsk{display:none;}  /* dettagli in più che compaiono solo quando c'è spazio */
@media(min-width:820px){.dsk{display:inline;}}
/* i due giorni vanno sempre uno sotto l'altro, a qualsiasi larghezza */
.duecol>section{min-width:0;}
.duecol>section+section{margin-top:26px;}
.giorno{font-size:13px;font-weight:700;color:#fff;background:var(--blu);border-radius:8px;
        padding:7px 12px;margin-bottom:9px;letter-spacing:.2px;}
.giorno::first-letter{text-transform:uppercase;}

@media (hover:hover) and (pointer:fine){
  .card:hover,.risultato:hover,.fl:hover,.tl:hover{box-shadow:0 3px 12px rgba(11,61,102,.16);}
  .datebar button:hover{background:rgba(255,255,255,.28);}
  .datebar .oggi:hover{background:#dab52e;}
  .tabs button:hover{background:#f2f5f8;}
  .btnrow button:hover{filter:brightness(1.06);}
}
@media (min-width:820px){
  body{padding-bottom:92px;}
  header{padding:14px 0;box-shadow:0 1px 6px rgba(0,0,0,.18);}
  header h1{font-size:20px;max-width:1120px;margin:0 auto;padding:0 22px;}
  .datebar{max-width:1120px;margin:12px auto 0;padding:0 22px;}
  .datebar input{flex:0 1 210px;}
  .datebar .oggi{font-size:14px;padding:0 16px;}
  main{max-width:1120px;margin:0 auto;padding:18px 22px 28px;}
  /* i tab diventano una barra flottante centrata invece di occupare tutta la base */
  .tabs{left:50%;right:auto;transform:translateX(-50%);bottom:20px;width:auto;
        border:1px solid #dde3ea;border-radius:999px;overflow:hidden;
        box-shadow:0 8px 28px rgba(11,61,102,.20);}
  .tabs button{flex:0 0 auto;padding:12px 26px;font-size:13.5px;}
  .tabs button.att{background:#eaf1f7;}
  /* la modale diventa una finestra centrata, non più un foglio che sale dal basso */
  .ovl{background:rgba(9,26,41,.5);}
  .modal{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);
         width:min(700px,92vw);max-height:88vh;border-radius:16px;padding:22px 24px;
         box-shadow:0 28px 70px rgba(0,0,0,.34);}
  .modal h2{font-size:18px;}
  /* i campi dei dettagli su due colonne: la modale scorreva per tre schermate */
  #editBox{column-count:2;column-gap:22px;}
  #editBox label{break-after:avoid;-webkit-column-break-after:avoid;margin-top:10px;}
  #editBox input,#editBox textarea{break-before:avoid;-webkit-column-break-before:avoid;break-inside:avoid;}
  #editBox .btnrow{column-span:all;margin-top:18px;}
  #toast{bottom:104px;}
  .sommario{font-size:13.5px;padding:12px 16px;}
}
/* schermi larghi: Flotta e Rent su due colonne, le intestazioni di sezione a tutta riga */
@media (min-width:1080px){
  body[data-tab="flotta"] main,body[data-tab="rent"] main{
    display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start;}
  body[data-tab="flotta"] .sez,body[data-tab="rent"] .sez,
  body[data-tab="flotta"] .vuoto,body[data-tab="rent"] .vuoto,
  body[data-tab="flotta"] .sommario,body[data-tab="rent"] .sommario{grid-column:1/-1;}
}
@media (min-width:1400px){
  header h1,.datebar,main{max-width:1320px;}
}

/* ---------- plancia: mezzi in riga, tempo sull'asse ---------- */
.plbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.plzoom{display:flex;border:1px solid var(--bordo);border-radius:8px;overflow:hidden}
.plzoom button{border:0;background:var(--card);color:var(--testo);font:inherit;font-size:14px;padding:7px 13px;
  border-right:1px solid var(--bordo);cursor:pointer;min-width:44px}
.plzoom button:last-child{border-right:0}
.plzoom button:active{background:var(--bordo)}
.plhint{margin:0 0 8px;font-size:12px;color:var(--grigio);line-height:1.4}
.plarm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#e8f4ff;border:1px solid #9dcbf0;
  border-radius:9px;padding:8px 11px;margin-bottom:8px;font-size:13px;line-height:1.35}

.plwrap{border:1px solid var(--bordo);border-radius:10px;background:var(--card);overflow:hidden}
.plscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.plgrid{position:relative;display:inline-block;min-width:100%}
.plrow{display:flex;border-bottom:1px solid var(--bordo)}
.plrow:last-child{border-bottom:0}
.plrow.plhead{border-bottom:2px solid var(--testo);position:sticky;top:0;z-index:5;background:var(--card)}
.plrail{flex:0 0 116px;position:sticky;left:0;z-index:4;background:var(--card);border-right:1px solid var(--bordo);
  padding:7px 8px;font-size:12px;line-height:1.25}
.plrail b{display:block;font-size:12.5px}
.plrail span{display:block;font-size:10.5px;color:var(--grigio);margin-top:2px}
.plwarn{font-style:normal;color:var(--rosso);font-size:11px}
.plbadge{display:inline-block;font-style:normal;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-top:4px}
.plbadge.ok{background:#e3f6ea;color:#1c7a45;border:1px solid #a9dfc0}
.plbadge.no{background:#fdecea;color:var(--rosso);border:1px solid #f2b8b1}
.plrow.plovl .plrail{background:#fdecea}
.plrow.plovl .plrail b{color:var(--rosso)}
.plrow.plnone .plrail{background:#fff6e5}
.plrow.plnone .plrail b{color:#a86800}
.plrow.plcanok .plrail{box-shadow:inset 3px 0 0 var(--verde)}
.plrow.plcanno .plrail{opacity:.55}

.pllane{position:relative;flex:1 0 auto;min-height:44px;overflow:hidden}
.plhrs{height:26px;min-height:26px}
.plhrs i{position:absolute;top:6px;font-size:10.5px;color:var(--grigio);font-style:normal;transform:translateX(-50%);white-space:nowrap}
.plgline{position:absolute;top:0;bottom:0;width:1px;background:var(--bordo);opacity:.45}
.plblk{position:absolute;border-radius:6px;padding:3px 6px;overflow:hidden;cursor:grab;color:#fff;
  font-size:11px;line-height:12.5px;box-shadow:0 1px 2px rgba(0,0,0,.16);touch-action:none;user-select:none;z-index:2}
.plblk b{display:block;font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plblk span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.93}
.plblk.plpend{box-shadow:0 0 0 2px var(--ambra)}
.plblk.plbad{box-shadow:0 0 0 2px var(--rosso)}
.plblk.plsel{box-shadow:0 0 0 3px #1668c1}
.plblk.plnoaut{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 6px,transparent 6px 12px)}
.plgap{position:absolute;height:16px;border-radius:3px;text-align:center;z-index:1;overflow:hidden}
/* le ore in chiaro sopra la barra: quando finisce · quanto ci mette · quando è sul posto */
.plora{position:absolute;height:12px;line-height:12px;font-size:9.5px;font-weight:600;
  color:#5b6670;background:var(--card);padding:0 3px;border-radius:3px;white-space:nowrap;z-index:2}
.plora.plarr{color:#1c7a45;background:#eaf6ee}
.plora.pltardi{color:#a3231c;background:#fdecea;z-index:4;box-shadow:0 0 0 1px #f3b6b1}
.plgap i{font-style:normal;font-size:9.5px;color:#3c4650;line-height:16px;white-space:nowrap}
.plgvia{background:repeating-linear-gradient(135deg,#b9c3cc 0 4px,#cdd5db 4px 8px);opacity:.95}
.plgvia i{color:#2b3a45;font-weight:700}
.plgatt{background:#e6e9ec;opacity:.9}
.plgno{background:repeating-linear-gradient(135deg,rgba(197,34,31,.55) 0 4px,rgba(197,34,31,.25) 4px 8px)}
.plgno i{color:#7d1512;font-weight:700}
.plov{position:absolute;top:0;bottom:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(135deg,rgba(214,58,45,.34) 0 5px,rgba(214,58,45,.12) 5px 10px);

/* 6. Sul telefono la barra andava a scorrimento laterale: «🗓 2 giorni» restava fuori
   schermo e nessuno sapeva che ci fosse — una barra che scorre senza dirlo è una barra
   con dentro roba invisibile. Meglio due righe, si vedono tutti i bottoni. */

/* 16. la catena: la piazzola non dice più solo "ci sta", dice a che ora il mezzo è
   sul pick-up e con quanto margine. Ambra = ci arriva, ma per un soffio. */

/* 20. il pennello: la fila degli autisti, e i servizi di quello in mano marcati */
.plautbar{display:flex;gap:6px;align-items:center;overflow-x:auto;overflow-y:hidden;
  padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}

.plblk.plmio{outline:2px solid #1668c1;outline-offset:-2px}
.pltile.plmio{border-left-color:#1668c1}
/* 19. il salvataggio non deve restare in cima alla pagina mentre si lavora a metà giornata */
/* sopra il messaggino, che sta a 80px: se si coprono a vicenda non si salva più niente */
.plsalva{position:fixed;left:10px;right:10px;bottom:88px;z-index:15;margin:0;
  box-shadow:0 8px 26px rgba(11,61,102,.28);align-items:center}
@media (min-width:820px){
  .plsalva{left:50%;right:auto;transform:translateX(-50%);width:auto;bottom:88px}
}
/* 18. il vassoio è una colonna a destra che scorre, non una striscia in fondo alla pagina */
.plmain{display:grid;gap:12px;align-items:start}
.pltray{margin-top:0;display:flex;flex-direction:column;min-height:0;max-height:min(62vh,560px)}
.pltiles{flex:1;flex-direction:column;flex-wrap:nowrap;overflow-y:auto;min-height:0;
  -webkit-overflow-scrolling:touch}
.pltile{width:auto}
.plriapri{display:none}
@media (min-width:900px){
  /* nell'HTML il vassoio viene prima: qui torna nella colonna di destra, dov'era */
  .plmain{grid-template-columns:minmax(0,1fr) 250px}
  .plwrap{grid-column:1;grid-row:1}
  .pltray{grid-column:2;grid-row:1;position:sticky;top:8px;max-height:calc(100vh - 130px)}
}
@media (min-width:820px){ .pltray .pltile{width:auto} }
/* 21. sul telefono il vassoio era in fondo alla pagina: per vederlo bisognava scorrere
   tutta la plancia, e infatti non lo trovava nessuno. Qui diventa una striscia in cima
   che scorre di lato e resta appiccicata sotto l'intestazione mentre si guarda la
   giornata. Armato un servizio si richiude da sola: la striscia gialla dice già cosa
   hai in mano, e le corsie si riprendono lo schermo. */
@media (max-width:899px){
  .plmain{display:block}
  .pltray{position:sticky;top:var(--plsotto,96px);z-index:9;max-height:none;margin:0 0 10px;
    box-shadow:0 6px 16px rgba(11,61,102,.13)}
  .pltray>h4{padding:7px 10px}
  .pltiles{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    padding:8px 10px;min-height:0;scroll-snap-type:x proximity}
  .pltile{width:196px;scroll-snap-align:start;touch-action:pan-x}
  .pltray.plridotto .pltiles{display:none}
  .pltray.plridotto .plriapri{display:inline-flex;margin-left:auto}
  .plvuoto{padding:8px 2px}
  .plpiu{display:none}
}
/* anteprima: si guarda e basta, non deve intercettare i clic diretti al quadratino sotto */
#plcard.plcpeek{pointer-events:none}
/* 17. due giorni sullo stesso asse: la mezzanotte è una riga vera, non un'ora come le altre */
.plmezza{position:absolute;top:0;bottom:0;width:2px;background:var(--blu);opacity:.55;z-index:1}
.plhrs i.pldom{color:var(--blu);font-weight:700}

  background:#e7eef5;border-radius:5px;padding:1px 6px;margin-top:2px}
@media (min-width:820px){ .plrail{flex-basis:176px} .pltile{width:224px} }

<body>
<header>
  <h1>🚐 Transfer Experience — Planner</h1>
  <div class="datebar">
    <button onclick="shiftDay(-1)">‹</button>
    <input type="date" id="datePick" onchange="useDate(this.value)">
    <button onclick="shiftDay(1)">›</button>
    <button class="oggi" onclick="goToday()">Oggi</button>
    <button onclick="openSearch()">🔍</button>
    <button onclick="load()">🔄</button>
  </div>
</header>

<main id="main"><div class="spin"></div></main>

<div class="tabs">
  <button id="tabS" class="att" onclick="setTab('servizi')">📋 Servizi</button>
  <button id="tabA" onclick="setTab('assegna')">🧩 Assegna</button>
  <button id="tabP" onclick="setTab('plancia')">🎛 Plancia</button>
  <button id="tabF" onclick="setTab('flotta')">⏳ Flotta</button>
  <button id="tabT" onclick="setTab('timeline')">📊 Timeline</button>
  <button id="tabR" onclick="setTab('rent')">🔑 Rent</button>
</div>

<div class="ovl" id="ovl" onclick="closeModal()"></div>
<div class="modal" id="modal"></div>
<div id="toast"></div>

<script>
var BOOT=<?!= boot ?>;
var DATA=null, TAB='servizi', CUR=null, TIMER=null, TICK=0, PENDING=null, MODAL_OPEN=false, PEND={}, SEARCH_RES=[];
/* vista a due giorni affiancati (solo su schermo largo) */
var DUE=false, G2=null, LOADING={};
function setDue(v){
  DUE=!!v;
  try{localStorage.setItem('te_due',DUE?'1':'0');}catch(e){}
  if(DUE){var d2=addDaysC(document.getElementById('datePick').value||DATA.date,1);if(!PLANS[d2])caricaGiorno(d2);}
  render();
}

/* Filtri autisti e mezzi: si tiene l'elenco di chi è NASCOSTO, non di chi è mostrato,
   così un autista o un mezzo nuovo (cambio giornata) resta visibile di default.
   '__none__' = i servizi ancora scoperti su quel fronte. */
var AUT_HIDE={}, AUT_FILTRI=[], VEI_HIDE={}, VEI_FILTRI=[];
function autNascosti(){return Object.keys(AUT_HIDE).length;}
function veiNascosti(){return Object.keys(VEI_HIDE).length;}
function servizioVisibile(s){
  return !AUT_HIDE[s.autista||'__none__'] && !VEI_HIDE[s.veicolo||'__none__'];
}
function toggleFiltro_(lista,hide,k){
  var n=lista[k],x;
  if(n===''){for(x in hide)delete hide[x];}
  else if(n==='__nessuno__'){
    for(x in hide)delete hide[x];
    lista.forEach(function(z){if(z&&z!=='__nessuno__')hide[z]=true;});
  }
  else if(hide[n])delete hide[n];
  else hide[n]=true;
  render();
}
function setAutIdx(k){toggleFiltro_(AUT_FILTRI,AUT_HIDE,k);}
function setVeiIdx(k){toggleFiltro_(VEI_FILTRI,VEI_HIDE,k);}

/* Una fila di chip per ogni autista (o mezzo) che ha servizi nei giorni visibili,
   col suo colore e il numero di servizi. Un tocco lo toglie dall'elenco.
   I nomi non entrano mai dentro l'onclick (gli apostrofi romperebbero l'HTML):
   si passa l'indice e il nome si rilegge dall'elenco. */
function barraFiltro_(o){
  var giorni=[DATA];
  if(DUE&&G2&&PLANS[G2]&&PLANS[G2].services)giorni.push(PLANS[G2]);
  var conta={},senza=0;
  giorni.forEach(function(D){
    D.services.forEach(function(s){
      if(isCanc(s))return;
      var v=String(s[o.campo]||'').trim();
      if(v)conta[v]=(conta[v]||0)+1;else senza++;
    });
  });
  var nomi=Object.keys(conta).sort(function(x,y){return x.localeCompare(y);});
  if(!nomi.length&&!senza)return '';
  var lista=['','__nessuno__'].concat(nomi);
  if(senza)lista.push('__none__');
  o.salvaLista(lista);
  var hide=o.hide,totali=nomi.length+(senza?1:0),nascosti=Object.keys(hide).length;

  // Tutti / Nessuno sono comandi, non voci dell'elenco: non vanno mai barrati
  function azione(k,label,attivo){
    return '<button class="chip'+(attivo?' verde':'')+'" style="border:none;white-space:nowrap" onclick="'+o.fn+'('+k+')">'+label+'</button>';
  }
  function chip(k,label,colore,spento,titolo){
    var st=spento
      ?'background:#eef1f4;color:#b6bcc3;font-weight:500;text-decoration:line-through;opacity:.85'
      :'background:'+colore+'22;color:'+colore+';font-weight:600';
    return '<button class="chip" style="border:none;white-space:nowrap;'+st+'" title="'+titolo+'" onclick="'+o.fn+'('+k+')">'+label+'</button>';
  }
  var h='<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;overflow-x:auto;font-size:12px">'
    +'<span style="color:#9aa0a6;white-space:nowrap;min-width:52px">'+o.titolo+'</span>'
    +azione(0,'Tutti',nascosti===0)
    +azione(1,'Nessuno',nascosti>=totali);
  nomi.forEach(function(n,k){
    h+=chip(k+2,esc(n)+' <span style="opacity:.7">'+conta[n]+'</span>',o.colore(n),!!hide[n],
            hide[n]?'rimetti in elenco':'togli dall\'elenco');
  });
  if(senza)h+='<button class="chip" style="border:none;white-space:nowrap;'
    +(hide['__none__']?'background:#eef1f4;color:#b6bcc3;font-weight:500;text-decoration:line-through'
                      :'background:#fce8e6;color:var(--rosso);font-weight:600')
    +'" onclick="'+o.fn+'('+(lista.length-1)+')">⚠️ '+o.vuoto+' <span style="opacity:.7">'+senza+'</span></button>';
  if(nascosti)h+='<span style="color:#9aa0a6;white-space:nowrap;margin-left:2px">'+(totali-nascosti)+' di '+totali+'</span>';
  return h+'</div>';
}
function barraAutisti(){
  return barraFiltro_({titolo:'Autisti:',campo:'autista',hide:AUT_HIDE,fn:'setAutIdx',
    vuoto:'Senza autista',colore:colorOf,salvaLista:function(l){AUT_FILTRI=l;}});
}
function barraMezzi(){
  return barraFiltro_({titolo:'Mezzi:',campo:'veicolo',hide:VEI_HIDE,fn:'setVeiIdx',
    vuoto:'Senza mezzo',colore:colorOfVeicolo,salvaLista:function(l){VEI_FILTRI=l;}});
}

function caricaGiorno(d){
  if(LOADING[d])return;
  LOADING[d]=1;
  google.script.run

/* niente verde né rosso fra i colori degli autisti: quelli dicono "ci sta" e "non ci sta" */

function colorOf(nome){

function fmtMin(m){if(m<0)return '—';m=((m%1440)+1440)%1440;return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2);}
function fmtDur(m){m=Math.round(m);var neg=m<0;if(neg)m=-m;var h=Math.floor(m/60),r=m%60;return (neg?'-':'')+((h?h+'h ':'')+(r?r+'m':(h?'':'0m'))).trim();}
/* riconosce il separatore decimale invece di eliminare sempre i punti.
   Prima "150.5" (numero letto dal foglio) diventava 1505: incasso della giornata ×10. */
function eur(t){
  if(typeof t==='number')return isNaN(t)?0:t;
  var s=String(t==null?'':t).trim().replace(/[^\d.,\-]/g,'');
  if(!s||s==='-')return 0;
  var lc=s.lastIndexOf(','),lp=s.lastIndexOf('.');
  var dec=lc>lp?',':(lp>lc?'.':'');
  if(dec){
    var coda=s.length-s.lastIndexOf(dec)-1;
    if(coda===3&&(lc===lp||s.split(dec).length===2))dec='';
  }
  if(dec===','){s=s.replace(/\./g,'').replace(',','.');}
  else if(dec==='.'){s=s.replace(/,/g,'');}
  else {s=s.replace(/[.,]/g,'');}
  var n=parseFloat(s);return isNaN(n)?0:n;
}
function fmtData(iso){if(!iso)return '';var d=new Date(iso+'T12:00:00');return ['dom','lun','mar','mer','gio','ven','sab'][d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);}
var MESI_IT=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
var GIORNI_IT=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
