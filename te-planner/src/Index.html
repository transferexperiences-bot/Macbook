/* ---------- motore disponibilità (replica Turni v6) ---------- */
/* Stesso posto = l'autista è già lì. Vale anche se scritto in modo diverso
   ("Aeroporto di Bari" / "Apt Bari" / "Aeroporto di Bari - Arrivi").
   Stessa regola del backend, ripetuta qui perché la app deve essere giusta anche
   quando in _CacheTratte è rimasto un valore vecchio per quella coppia. */
/* I nomi dei luoghi sono sempre gli stessi dieci o cento, e questa funzione fa sette
   sostituzioni con espressioni regolari: su una giornata piena veniva chiamata cinquemila
   volte a disegno. Il risultato dipende solo dalla stringa, quindi si tiene. */
var _NORML={},_NORMN=0;
function normLuogoUI(x){
  var k=String(x||'');
  if(_NORML.hasOwnProperty(k))return _NORML[k];
  var v=normLuogoUI_(k);
  if(_NORMN>4000){_NORML={};_NORMN=0;}   // rete di sicurezza, non deve crescere all'infinito
  _NORML[k]=v;_NORMN++;
  return v;
}
function normLuogoUI_(x){
  return String(x||'').toLowerCase().trim()
    .replace(/[.,;:'"()\/\-]/g,' ')
    .replace(/\b(aeroporto( di)?|airport|apt|aereoporto)\b/g,'apt')
    .replace(/\b(arrivi|partenze|arrivals|departures|terminal|gate|t1|t2)\b/g,' ')
    .replace(/\b(italia|italy|ba|br|bt|le|ta|fg)\b/g,' ')
    .replace(/[^a-z0-9à-ù ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function stessoLuogoUI(a,b){var x=normLuogoUI(a),y=normLuogoUI(b);return !!x&&x===y;}
/* Un indice solo per la giornata mostrata: per id, per autista, per mezzo, più le tratte
   già calcolate. Prima ogni controllo di disponibilità rifiltrava tutti i servizi: con
   trenta mezzi e cento servizi erano cinquantamila giri di lista a disegno.
   Si rifà da zero all'inizio di ogni render() — dopo ogni assegnazione si ridisegna, quindi
   non può restare indietro — e i test lo forzano mettendo `_BYID_SRC = null`. */
var _BYID_SRC=null,_BYID={},_IDXA={},_IDXV={},_TRF={};
function _reindicizza(){
  _BYID={};_IDXA={};_IDXV={};_TRF={};
  if(DATA&&DATA.services)DATA.services.forEach(function(s){
    _BYID[s.id]=s;
    if(isCanc(s)||s.startMin<0)return;
    var a=String(s.autista||''),v=String(s.veicolo||'');
    if(a){if(!_IDXA[a])_IDXA[a]=[];_IDXA[a].push(s);}
    if(v){if(!_IDXV[v])_IDXV[v]=[];_IDXV[v].push(s);}
  });
  _BYID_SRC=DATA;
}
function srvById(id){
  if(_BYID_SRC!==DATA)_reindicizza();
  return _BYID[id]||null;
}
/* i servizi veri di un autista o di un mezzo, senza riscorrere la giornata */
function srvDi(chiave,valore){
  if(_BYID_SRC!==DATA)_reindicizza();
  return ((chiave==='autista'?_IDXA:_IDXV)[String(valore||'')])||[];
}
function trf(aId,bId){
  if(_BYID_SRC!==DATA)_reindicizza();
  var k=aId+'->'+bId,c=_TRF[k];
  if(c)return c;
  var A=_BYID[aId],B=_BYID[bId],t;
  if(A&&B&&stessoLuogoUI(A.per,B.da))t={min:0,buffer:0};
  else t=DATA.transfers[k]||{min:30,buffer:DATA.bufferDefault};
  _TRF[k]=t;
  return t;
}
/* La regola madre, una sola per tutta la app: fine A + trasferimento + buffer <= inizio B.
   Con una tolleranza in più: un servizio che parte da un aeroporto e ha un volo non
   comincia all'ora scritta, comincia all'atterraggio più i bagagli (finestraInizio).
   Sta qui dentro e non nella Plancia perché Servizi, Flotta, Timeline e Plancia devono
   dare la stessa risposta sullo stesso servizio. */
function conflict(A,S){
  if(A.startMin<0||S.startMin<0)return null;
  var t1=trf(A.id,S.id),t2=trf(S.id,A.id);
  var AbeforeS=A.endMin+t1.min+t1.buffer<=S.startMin+finestraInizio(S);
  var SbeforeA=S.endMin+t2.min+t2.buffer<=A.startMin+finestraInizio(A);
  if(AbeforeS||SbeforeA)return null;
  return {freeAt:A.endMin+t1.min+t1.buffer,con:A};
}
/* Cancellato: l'Allert è il segno ufficiale, ma non è l'unico che arriva. La cancellazione
   morbida scrive anche in Note («Cancellazione 12/08/2026 10:15», il ⛔), e capita che
   qualcuno segni solo lì — quel servizio non va fatto, e non deve tenere occupato un mezzo.
   Si riconoscono solo i modi che parlano DEL SERVIZIO: «volo cancellato» è un'altra cosa,
   e nel dubbio si tiene (un servizio nascosto per sbaglio è un transfer che sparisce). */
var _RE_CANC = /⛔|(?:^|\|)\s*cancellazione\b|cancellazione\s+\d{1,2}[\/.\-]\d{1,2}|è\s+stat[oa]\s+(?:cancellat|annullat)[oa]|\b(?:servizio|transfer|corsa|viaggio|navetta|prenotazione)\s+(?:\S+\s+){0,2}?(?:cancellat|annullat)[oa]|^\s*(?:cancellat|annullat)[oa]\b/i;
var _RE_NONCANC = /\bnon\s+(?:\S+\s+){0,3}?(?:cancellat|annullat)[oa]/i;
function cancInNote(note){
  var n = String(note || '');
  if (!n) return false;
  if (_RE_NONCANC.test(n)) return false;   // «non è stato cancellato» non è una cancellazione
  return _RE_CANC.test(n);
}
function isCanc(s){
  return String(s.allert||'').indexOf('Cancellato')>=0 || cancInNote(s.note);
}
/* chiave = 'autista' | 'veicolo': quando la si passa si legge dall'indice invece di
   rifiltrare tutti i servizi. Senza, resta la strada vecchia (la usano i test). */
function availability(list,keyFn,S,chiave){
  var out={};
  list.forEach(function(item){
    var mine=chiave
      ? srvDi(chiave,item.nome).filter(function(sv){return sv.id!==S.id;})
      : DATA.services.filter(function(sv){return sv.id!==S.id&&!isCanc(sv)&&keyFn(sv)===item.nome&&sv.startMin>=0;});
    var worst=null;
    mine.forEach(function(A){var c=conflict(A,S);if(c&&(!worst||c.freeAt>worst.freeAt))worst=c;});
    out[item.nome]=worst;
  });
  return out;
}
/* ---------- chi può prendere un servizio ----------
   Soglie condivise fra consigli e scheda Assegna: un solo posto dove cambiarle.
   ATTESA_LONTANO = oltre queste ore di vuoto non è più "allungare il giro", è richiamare
   fuori uno che aveva finito. STRETTO = margine sotto il quale la riga diventa ambra. */
var ATTESA_LONTANO=240, STRETTO=20;
var FATT_OK={ok:1,stretto:1,fermo:1,libero:1};

/* Il giro di un autista nella giornata mostrata: solo servizi veri, in ordine di ora. */
function giroDi(nome,escludiId){
  if(!nome||!DATA||!DATA.services)return [];
  return srvDi('autista',nome).filter(function(sv){return sv.id!==escludiId;})
    .sort(function(a,b){return a.startMin-b.startMin;});
}
function autistiInServizio(){
  return DATA.autisti.filter(function(a){return giroDi(a.nome,null).length>0;});
}

/* Valuta un autista per un servizio: dove si aggancia, quanta attesa, se ci arriva.
   È la base sia dei consigli sia della scheda Assegna, così quello che si legge a
   schermo e quello che sceglie il codice sono la stessa identica cosa.
   k: 'ok' incastro nel giro · 'stretto' margine risicato · 'fermo' in servizio ma lontano
      · 'libero' oggi non lavora · 'no' occupato, non ci arriva · 'off' non disponibile */
function valutaAutista(S,nome){
  var out={nome:nome,k:'libero',txt:'',prev:null,next:null,attesaPrima:null,margineDopo:null,
           n:0,minuti:0,freeAt:-1,inServizio:false,vicino:null,vuoto:null,punti:0};
  var a=null,i;
  for(i=0;i<DATA.autisti.length;i++)if(DATA.autisti[i].nome===nome)a=DATA.autisti[i];
  if(a&&a.esclusoMotivo){out.k='off';out.txt=a.esclusoMotivo;return out;}
  var mine=giroDi(nome,S.id);
  out.n=mine.length;
  out.inServizio=mine.length>0;
  mine.forEach(function(P){out.minuti+=Math.max(0,P.durMin||0);});
  if(S.startMin<0){out.k=mine.length?'fermo':'libero';out.txt='servizio senza orario';return out;}
  // un solo conflitto basta per dire di no
  var worst=null;
  mine.forEach(function(P){var c=conflict(P,S);if(c&&(!worst||c.freeAt>worst.freeAt))worst=c;});
  if(worst){
    out.k='no';out.freeAt=worst.freeAt;out.prev=worst.con;
    out.txt='impegnato: si libera ~'+fmtMin(worst.freeAt)+' a '+worst.con.per;
    return out;
  }
  if(!mine.length){out.k='libero';out.txt='oggi non ha servizi';return out;}
  // a quale servizio si aggancia, prima e dopo
  mine.forEach(function(P){
    if(plFine(P)<=S.startMin&&(!out.prev||plFine(P)>plFine(out.prev)))out.prev=P;
    if(P.startMin>=plFine(S)&&(!out.next||P.startMin<out.next.startMin))out.next=P;
  });
  if(out.prev)out.attesaPrima=S.startMin-plFine(out.prev)-trf(out.prev.id,S.id).min;
  if(out.next)out.margineDopo=out.next.startMin-plFine(S)-trf(S.id,out.next.id).min;
  // vuoto = quanto l'autista resta fermo PRIMA di questo servizio (o, se il servizio
  // viene prima di tutto il suo giro, quanto gli resta dopo): è questo che dice se
  // conviene chiamarlo. vicino = il lato più stretto, e serve solo a dire se è rischioso.
  // Ordinare per il lato più stretto metteva davanti i giri più fragili: 5 minuti di
  // margine dopo sembravano meglio di mezz'ora d'attesa comoda.
  var vicino=Math.min(out.attesaPrima===null?99999:out.attesaPrima,
                      out.margineDopo===null?99999:out.margineDopo);
  out.vicino=vicino;
  out.vuoto=out.attesaPrima!==null?out.attesaPrima:(out.margineDopo!==null?out.margineDopo:99999);
  if(out.vuoto>ATTESA_LONTANO){
    out.k='fermo';
    out.txt=out.prev?('in servizio oggi, ma stacca alle '+fmtMin(out.prev.endMin)+' a '+out.prev.per)
           :(out.next?('in servizio oggi, ma solo dalle '+fmtMin(out.next.startMin)):'in servizio oggi');
    return out;
  }
  out.k=vicino<STRETTO?'stretto':'ok';
  out.punti=out.vuoto+(vicino<STRETTO?150:0);   // il rischio pesa, ma dopo il tempo morto
  var pezzi=[];
  if(out.prev)pezzi.push('arriva da '+out.prev.per+', attesa '+fmtDur(out.attesaPrima));
  if(out.next)pezzi.push('poi riparte da '+out.next.da+', margine '+fmtDur(out.margineDopo));
  out.txt=pezzi.join(' \u00b7 ');
  return out;
}

/* catene sempre pronte: il miglior candidato per un servizio scoperto, calcolato
   al volo dalle durate/tratte precalcolate (nessuna chiamata al server) */
function bestFor(S){
  if(S.autista||S.startMin<0)return null;
  var avA=availability(DATA.autisti,function(sv){return sv.autista;},S,'autista');
  var c=suggest(S,avA);
  return c.length?c[0]:null;
}
/* riceve solo l'indice e ricalcola il candidato: passare il nome dentro l'attributo
   onclick rompeva l'HTML con gli autisti che hanno l'apostrofo (D'Amico, Dell'Aquila) */
function assegnaRapido(i,dISO){
  var D=(dISO&&PLANS[dISO])?PLANS[dISO]:DATA;   // dISO = colonna di destra in vista 2 giorni
  var s=D.services[i];
  if(!s)return;
  var salva=DATA;DATA=D;                        // i candidati vanno calcolati sulla giornata giusta
  var bf=bestFor(s);
  DATA=salva;
  if(!bf){toast('Nessun autista disponibile per questo servizio');return;}
  PEND[s.id]={autista:bf.nome,veicolo:s.veicolo};
  s.autista=bf.nome;render();
  toast('🕐 '+bf.nome+' in sospeso ('+fmtData(D.date)+') — salva dalla barra in alto');
}
/* colore stabile per ogni mezzo, sfasato rispetto a quello degli autisti
   così un mezzo e un autista non finiscono mai con la stessa tinta */
function colorOfVeicolo(nome){
  if(!nome||!DATA)return '#7d93a8';
  for(var i=0;i<DATA.veicoli.length;i++)if(DATA.veicoli[i].nome===nome)return PALETTE[(i*5+7)%PALETTE.length];
  return '#7d93a8';
}

/* Miglior mezzo per un servizio scoperto: stessi controlli del menù a tendina
   (fuori servizio, noleggio, capienza, conflitti) più due preferenze —
   il mezzo che l'autista sta già usando in giornata, e il più piccolo che basta. */
function bestVeicoloFor(S){
  if(S.veicolo||S.startMin<0)return null;
  var avV=availability(DATA.veicoli,function(sv){return sv.veicolo;},S,'veicolo');
  var cands=[];
  DATA.veicoli.forEach(function(v){
    if(v.fuoriServizio||v.inRent)return;
    if(S.pax>0&&v.pax>0&&v.pax<S.pax)return;                 // non ci stanno
    var w=avV[v.nome];
    // impegnato su un servizio dello STESSO autista: viaggiano insieme, non è un conflitto
    if(w&&w.con&&S.autista&&w.con.autista===S.autista)w=null;
    if(w)return;
    var stesso=!!(S.autista&&DATA.services.some(function(sv){
      return sv.id!==S.id&&!isCanc(sv)&&sv.autista===S.autista&&sv.veicolo===v.nome;}));
    var avanzo=(v.pax>0&&S.pax>0)?(v.pax-S.pax):50;
    cands.push({nome:v.nome,pax:v.pax,score:(stesso?0:1000)+avanzo,
      reason:stesso?'già con '+S.autista+' oggi':(v.pax?v.pax+' posti per '+(S.pax||'?')+' pax':'libero')});
  });
  cands.sort(function(x,y){return x.score-y.score;});
  return cands.length?cands[0]:null;
}
function assegnaVeicoloRapido(i,dISO){
  var D=(dISO&&PLANS[dISO])?PLANS[dISO]:DATA;
  var s=D.services[i];
  if(!s)return;
  var salva=DATA;DATA=D;
  var bv=bestVeicoloFor(s);
  DATA=salva;
  if(!bv){toast('Nessun mezzo libero e capiente per questo servizio');return;}
  PEND[s.id]={autista:s.autista,veicolo:bv.nome};
  s.veicolo=bv.nome;render();
  toast('🕐 '+bv.nome+' in sospeso ('+fmtData(D.date)+') — salva dalla barra in alto');
}
/* Chi conviene chiamare, in ordine.
   Regola cambiata il 18/08: PRIMA chi sta già lavorando in giornata.
   La versione vecchia dava 300 di penalità a chi non era "Fisso" e solo 200 a chi non
   aveva nessun servizio: un autista fermo a casa batteva sempre chi era già fuori e a
   dieci minuti dal punto di ritiro. Ora l'ordine è:
     1. si incastra nel giro (punteggio = minuti di vuoto, meno è meglio)
     2. è in servizio oggi ma lontano nella giornata
     3. oggi non lavora  ← ultimo, e la riga lo dice
   Categoria e carico restano, ma come spareggio, non come fattore principale. */
/* Un solo punteggio per tutta la app: lo usano sia i consigli sia l'ordine dei blocchi
   nella scheda Assegna. Tenerne due significava vedere due classifiche diverse per lo
   stesso servizio nelle due colonne. */
function punteggioAutista(a,v){
  var fisso=(a.categoria||'').toLowerCase()==='fisso',s;
  if(v.k==='ok'||v.k==='stretto')s=Math.max(0,v.punti);
  else if(v.k==='fermo')s=1000+Math.round(Math.min(1440,v.vuoto===null?600:v.vuoto)/10);
  else if(v.k==='libero')s=4000+(fisso?0:150);
  else if(v.k==='no')s=8000+Math.max(0,v.freeAt);
  else s=9000;
  return s+(fisso?0:25)   // a parità, prima chi è in organico
          +v.n*3;         // e chi ha la giornata meno carica
}
function suggest(S,avA,quanti){
  var cands=[];
  DATA.autisti.forEach(function(a){
    if(a.esclusoMotivo)return;
    if(avA&&avA[a.nome])return;
    var v=valutaAutista(S,a.nome);
    if(v.k==='no'||v.k==='off')return;
    cands.push({nome:a.nome,cat:a.categoria,score:punteggioAutista(a,v),reason:v.txt,
                inServizio:v.inServizio,k:v.k,n:v.n,val:v});
  });
  cands.sort(function(x,y){return x.score-y.score||(x.nome<y.nome?-1:1);});
  return cands.slice(0,quanti||3);
}

/* ---------- catene: cosa si rompe (o si libera) se sposto questo servizio ----------
   Ogni servizio assegnato sta su due catene, quella del mezzo e quella dell'autista.
   Qui c'è una funzione sola: cambia la chiave e cambia la catena. NON è un secondo
   motore di fattibilità: arrivi, buffer e verdetti escono da trf() e dalla stessa
   regola di conflict() — fine + trasferimento + buffer ≤ inizio.  */
var TOLL_VOLO=20;         // atterraggio + bagagli: un arrivo non comincia all'ora scritta
var ORE_AUTISTA_MAX=720;  // 12 ore dalla prima partenza all'ultimo rientro

/* Un servizio che parte da un aeroporto e ha un volo può cominciare fino a 20 minuti dopo
   l'ora scritta: il cliente è ancora al nastro bagagli. Fuori da quel caso, finestra zero.
   Il riconoscimento dell'aeroporto passa da normLuogoUI(), che porta "Aeroporto di Bari",
   "Apt Bari" e "aereoporto" tutti a 'apt': niente elenco di nomi scritto a mano. */
function finestraInizio(s){
  if(!s||!String(s.volo||'').trim())return 0;
  return /\bapt\b/.test(normLuogoUI(s.da))?TOLL_VOLO:0;
}
/* verde ci sta · ambra ci sta ma stretto · finestra = ci arriva entro i bagagli · rosso no */
function giudizioMargine(margine,finestra){
  if(margine>=STRETTO)return 'ok';
  if(margine>=0)return 'stretto';
  if(margine>=-finestra)return 'finestra';
  return 'rotto';
}
/* Tutti i servizi di una catena (mezzo o autista) nella giornata mostrata, in ordine. */
function catenaDi(chiave,valore,escludiId){
  var v=String(valore||'');
  if(!v||!DATA||!DATA.services)return [];
  return srvDi(chiave,v).filter(function(sv){return sv.id!==escludiId;})
    .sort(function(a,b){return a.startMin-b.startMin;});
}
/* Il collegamento fra due servizi consecutivi della stessa catena: quando il mezzo è
   materialmente sul pick-up del secondo, e quanto margine resta. */
function trattaFra(A,B){
  if(!A||!B||A.startMin<0||B.startMin<0)return null;
  var t=trf(A.id,B.id);
  var arrivo=plFine(A)+t.min;
  var fin=finestraInizio(B);
  // trf() quando non ha la coppia in DATA.transfers torna 30 minuti di default: è una
  // stima, e va detto invece di spacciarla per un tempo Maps
  var noto=!!(DATA.transfers&&DATA.transfers[A.id+'->'+B.id])||stessoLuogoUI(A.per,B.da);
  return {da:A,a:B,arrivo:arrivo,trasf:t.min,buffer:t.buffer,stima:!noto,
          margine:B.startMin-arrivo-t.buffer,finestra:fin,
          k:giudizioMargine(B.startMin-arrivo-t.buffer,fin)};
}
/* Rientro in garage di una catena: riusa garageInfo(), che tace se rientroMin non c'è. */
function rientroCatena(giro){var g=garageInfo(giro);return g?g.at:null;}

/* IL CUORE. Dato un servizio e una destinazione ipotetica (mezzo o autista), dice:
   dove il mezzo/autista è adesso e a che ora è sul pick-up · il margine col segno ·
   cosa succede al servizio successivo di quella catena · cosa si libera su quella di
   partenza · come cambia il rientro in garage. Non tocca niente: sola lettura. */
function catenaIpotesi(S,chiave,valore,salta){
  var out={chiave:chiave,da:String(S[chiave]||''),a:String(valore||''),
           arrivo:null,daDove:null,trasf:0,buffer:0,margine:null,stima:false,
           finestra:finestraInizio(S),k:'libero',sovrapposti:[],aValle:[],liberati:[],
           rientro:{prima:null,dopo:null},rientroOrigine:{prima:null,dopo:null}};
  if(!S||S.startMin<0)return out;
  var giro=catenaDi(chiave,out.a,S.id);
  if(salta)giro=giro.filter(function(P){return !salta(P);});
  var prev=null,next=null,i;
  for(i=0;i<giro.length;i++){
    var P=giro[i];
    if(P.startMin<plFine(S)&&plFine(P)>S.startMin){out.sovrapposti.push(P);continue;}
    if(plFine(P)<=S.startMin&&(!prev||plFine(P)>plFine(prev)))prev=P;
    if(P.startMin>=plFine(S)&&(!next||P.startMin<next.startMin))next=P;
  }
  // 1. da dove arriva e a che ora è sul posto
  if(prev){
    var t=trattaFra(prev,S);
    out.daDove=prev; out.arrivo=t.arrivo; out.trasf=t.trasf; out.buffer=t.buffer;
    out.margine=t.margine; out.stima=t.stima; out.k=t.k;
  } else if(out.a){
    out.daDove='garage';           // base → pick-up non è in cache: non si inventa un'ora
    out.k=out.sovrapposti.length?'rotto':'ok';
  }
  if(out.sovrapposti.length)out.k='rotto';
  // 2. effetto a valle: al servizio dopo cambia chi lo precede
  if(next){
    var era=prev?trattaFra(prev,next):null;
    var ora=trattaFra(S,next);
    if(!era||era.k!==ora.k||era.margine!==ora.margine){
      out.aValle.push({id:next.id,srv:next,
        era:era?era.k:'libero',diventa:ora.k,
        margine:ora.margine,ritardo:ora.margine<0?-ora.margine:0,
        stima:ora.stima});
    }
  }
  // 3. cosa si libera sulla catena di partenza
  if(out.da&&out.da!==out.a){
    var vecchio=catenaDi(chiave,out.da,S.id),pO=null,nO=null;
    if(salta)vecchio=vecchio.filter(function(P){return !salta(P);});
    vecchio.forEach(function(P){
      if(plFine(P)<=S.startMin&&(!pO||plFine(P)>plFine(pO)))pO=P;
      if(P.startMin>=plFine(S)&&(!nO||P.startMin<nO.startMin))nO=P;
    });
    if(nO){
      var prima=trattaFra(S,nO),dopo=pO?trattaFra(pO,nO):null;
      out.liberati.push({id:nO.id,srv:nO,
        guadagno:dopo?(dopo.margine-prima.margine):null,
        era:prima.k,diventa:dopo?dopo.k:'libero'});
    }
    out.rientroOrigine.prima=rientroCatena(catenaDi(chiave,out.da,null));
    out.rientroOrigine.dopo=rientroCatena(vecchio);
  }
  // 4. rientro in garage della catena di destinazione, prima e dopo
  out.rientro.prima=rientroCatena(giro);
  out.rientro.dopo=rientroCatena(giro.concat([S]));
  return out;
}
/* Sulla catena del MEZZO i servizi dello stesso autista non contano come intralcio:
   viaggiano insieme, la fattibilità è già quella dell'autista. Stessa esenzione che
   c'è nel menù del dettaglio e in plScontro. */
function plCatena(S,veicoloIpotetico){
  return catenaIpotesi(S,'veicolo',veicoloIpotetico,function(P){
    return !!(S.autista&&P.autista===S.autista);});
}
function plCatenaAutista(S,autistaIpotetico){return catenaIpotesi(S,'autista',autistaIpotetico);}

/* Ore dell'autista: dalla prima partenza all'ultimo rientro in garage. Non è un divieto,
   è un numero che oggi si scopre solo a fine giornata. `extra` = servizio che si sta per
   aggiungere, per vedere la giornata come sarebbe dopo la mossa. */
function oreAutista(nome,extra){
  var giro=catenaDi('autista',nome,extra?extra.id:null);
  if(extra)giro=giro.concat([extra]).sort(function(a,b){return a.startMin-b.startMin;});
  if(!giro.length)return null;
  var g=garageInfo(giro);
  var fine=g?g.at:null;
  giro.forEach(function(s){if(fine===null||s.endMin>fine)fine=s.endMin;});
  var inizio=giro[0].startMin;
  return {inizio:inizio,fine:fine,minuti:fine-inizio,garage:!!g,
          oltre:(fine-inizio)>ORE_AUTISTA_MAX};
}

/* ---------- viste ---------- */
function render(){
  _BYID_SRC=null;   // una assegnazione cambia i servizi senza cambiare l'oggetto DATA: si riparte da capo
  document.body.setAttribute('data-tab',TAB); // serve al CSS per le due colonne su schermo largo
  if(TAB!=='plancia'){var _c=document.getElementById('plcard');if(_c)_c.style.display='none';}
  // non ridisegnare sotto il dito — ma solo se il dito c'è ancora davvero: un blocco
  // sparito (dati ricaricati, scheda cambiata) lasciava PL_DRAG acceso per sempre
  if(TAB==='plancia'&&PL_DRAG&&!plNodoDi(PL_DRAG))plMollaTutto();
  if(TAB==='plancia'&&(PL_DRAG||PL_PINCH))return;
  if(TAB==='servizi')renderServizi();
  else if(TAB==='assegna')renderAssegna();
  else if(TAB==='plancia')renderPlancia();
  else if(TAB==='flotta')renderFlotta();
  else if(TAB==='timeline')renderTimeline();
  else renderRent();
}

var FILT='tutti', VIEW='righe', ORD='orario';
function setFilt(f){FILT=f;render();}
function setView(v){VIEW=v;render();}
function setOrd(o){ORD=o;render();}
function isDone(s){
  if(isCanc(s))return true;
  if(String(s.stato||'').toLowerCase().indexOf('eseguito')>=0)return true;
  if(DATA.date<DATA.today)return true;
  if(DATA.date>DATA.today)return false;
  if(s.endMin<0)return false;
  return Math.min(s.endMin,1439)<=DATA.nowMin; // i servizi oltre mezzanotte contano come chiusi a fine giornata
}
function azioni(s){
  var a='';
  var digits=(s.cell||'').replace(/[^\d+]/g,'');
  if(digits)a+='<a href="tel:'+digits+'" onclick="event.stopPropagation()">📞</a>';
  var wa=s.wa&&s.wa.indexOf('http')===0?s.wa:(digits?'https://wa.me/'+digits.replace('+',''):'');
  if(wa)a+='<a href="'+esc(wa)+'" target="_blank" onclick="event.stopPropagation()">💬</a>';
  if(s.da&&s.per)a+='<a href="https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(s.da)+'&destination='+encodeURIComponent(s.per)+'" target="_blank" onclick="event.stopPropagation()">🗺️</a>';
  return a?'<span class="azioni">'+a+'</span>':'';
}
/* la barra gialla dei salvataggi in sospeso: uguale in Servizi e in Assegna */
/* cls = classe in più. In Plancia la barra sta fissa in fondo allo schermo: si assegna
   scorrendo la giornata, e il salvataggio deve restare a portata di pollice invece di
   essere rimasto in cima alla pagina. */
function barraPend(cls){
  var nP=Object.keys(PEND).length;
  if(!nP)return '';
  return '<div class="sommario '+(cls||'')+'" style="background:#fff8e6;border:1px solid #f0d9a8">'
    +'<span>🕐 <b>'+nP+'</b> da salvare</span>'
    +'<button class="chip verde" style="border:none" onclick="salvaTutto(false)">💾 Salva tutto</button>'
    +'<button class="chip ambra" style="border:none" onclick="salvaTutto(true)">📋 Salva + Recap</button>'
    +'<button class="chip" style="border:none" onclick="annullaPend()">↩️ Annulla</button>'
    +'</div>';
}
function renderServizi(){
  var m=document.getElementById('main'),h='';
  h+=barraPend();
  // giorni scoperti prossimi 7
  if(DATA.prossimi&&DATA.prossimi.length){
    var sc=DATA.prossimi.filter(function(p){return p.senzaAutista>0||p.senzaMezzo>0;});
    if(sc.length){
      h+='<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px">';
      sc.forEach(function(p){
        h+='<button class="chip ambra" style="border:none;white-space:nowrap" onclick="goDate(\''+p.date+'\')">'+fmtData(p.date)+': '+p.tot+' srv · ⚠️'+Math.max(p.senzaAutista,p.senzaMezzo)+'</button>';
      });
      h+='</div>';
    }
  }
  G2=DUE?addDaysC(DATA.date,1):null;
  if(!DUE&&!DATA.services.length){m.innerHTML=h+'<div class="vuoto">Nessun servizio per '+DATA.weekday+' '+DATA.date+'</div>';return;}
  // barre di filtro e ordinamento: sono globali, valgono per tutte e due le colonne
  var nDone=DATA.services.filter(isDone).length,nTodo=DATA.services.length-nDone;
  h+='<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap">'
    +'<button class="chip'+(FILT==='tutti'?' verde':'')+'" style="border:none" onclick="setFilt(\'tutti\')">Tutti ('+DATA.services.length+')</button>'
    +'<button class="chip'+(FILT==='dafare'?' verde':'')+'" style="border:none" onclick="setFilt(\'dafare\')">🔜 Da fare ('+nTodo+')</button>'
    +'<button class="chip'+(FILT==='svolti'?' verde':'')+'" style="border:none" onclick="setFilt(\'svolti\')">✔️ Svolti ('+nDone+')</button>'
    +'<button class="chip'+(DUE?' verde':'')+'" style="border:none" onclick="setDue('+(DUE?'false':'true')+')" title="mostra oggi e domani affiancati">🗓 2 giorni</button>'
    +'<button class="chip" style="border:none;margin-left:auto" onclick="setView(\''+(VIEW==='righe'?'card':'righe')+'\')">'+(VIEW==='righe'?'▤ Card':'≡ Righe')+'</button>'
    +'</div>';
  h+='<div style="display:flex;gap:6px;margin-bottom:10px;align-items:center;overflow-x:auto;font-size:12px">'
    +'<span style="color:#9aa0a6;white-space:nowrap">Ordina:</span>'
    +'<button class="chip'+(ORD==='orario'?' verde':'')+'" style="border:none;white-space:nowrap" onclick="setOrd(\'orario\')">🕐 Orario</button>'
    +'<button class="chip'+(ORD==='autista'?' verde':'')+'" style="border:none;white-space:nowrap" onclick="setOrd(\'autista\')">🚹 Autista</button>'
    +'<button class="chip'+(ORD==='mezzo'?' verde':'')+'" style="border:none;white-space:nowrap" onclick="setOrd(\'mezzo\')">🚗 Mezzo</button>'
    +'<button class="chip'+(ORD==='fornitore'?' verde':'')+'" style="border:none;white-space:nowrap" onclick="setOrd(\'fornitore\')">🏨 Fornitore</button>'
    +'<button class="chip'+(ORD==='scoperti'?' verde':'')+'" style="border:none;white-space:nowrap" onclick="setOrd(\'scoperti\')">⚠️ Scoperti prima</button>'
    +'</div>';
  h+=barraAutisti();
  h+=barraMezzi();

  // vista a un giorno solo
  if(!DUE){m.innerHTML=h+pannelloGiorno(null);return;}

  // 2 giorni + ordinamento per autista o per mezzo: un elenco solo, il giro di ognuno di seguito
  if(ORD==='autista'||ORD==='mezzo'){
    var chiave=ORD==='autista'?'autista':'veicolo';
    var pronto=G2&&PLANS[G2]&&PLANS[G2].services;
    if(!pronto)caricaGiorno(G2);
    m.innerHTML=h+'<div class="giorno">'+esc(fmtDataLunga(DATA.date))+' + '+esc(fmtDataLunga(G2))+' — giro per '+(ORD==='autista'?'autista':'mezzo')+'</div>'
      +(pronto?pannelloUnito(chiave):'<div class="spin"></div>');
    return;
  }

  // due giornate una sotto l'altra: la seconda è quasi sempre già in memoria
  // perché load() la scarica in sottofondo appena apri la prima
  var d2=G2;
  var p1='<section><div class="giorno">'+esc(fmtDataLunga(DATA.date))+'</div>'+pannelloGiorno(null)+'</section>';
  var p2,P2=PLANS[d2];
  if(P2&&P2.services){
    var salva=DATA;DATA=P2;
    p2='<section><div class="giorno">'+esc(fmtDataLunga(d2))+'</div>'+pannelloGiorno(d2)+'</section>';
    DATA=salva;
  } else {
    p2='<section><div class="giorno">'+esc(fmtDataLunga(d2))+'</div><div class="spin"></div></section>';
    caricaGiorno(d2);
  }
  m.innerHTML=h+'<div class="duecol">'+p1+p2+'</div>';
}

/* Costruisce sommario + elenco per la giornata attualmente in DATA.
   g2 = data ISO quando è la colonna di destra: serve per far puntare i tocchi
   al giorno giusto invece che al giorno ancorato. */
function pannelloGiorno(g2){
  var h='';
  if(!DATA.services.length)return '<div class="vuoto">Nessun servizio per '+DATA.weekday+' '+DATA.date+'</div>';
  // sommario giornata
  var nA=0,nV=0,tot=0;
  DATA.services.forEach(function(s){if(isCanc(s))return;if(!s.autista)nA++;if(!s.veicolo)nV++;tot+=eur(s.tariffa);});
  h+='<div class="sommario">'
    +'<span><b>'+DATA.services.length+'</b> servizi</span>'
    +(nA?'<span class="chip rosso">'+nA+' senza autista</span>':'<span class="chip verde">autisti ok</span>')
    +(nV?'<span class="chip rosso">'+nV+' senza mezzo</span>':'<span class="chip verde">mezzi ok</span>')
    +'<span style="margin-left:auto">💶 <b>'+tot.toLocaleString('it-IT',{minimumFractionDigits:2})+'€</b></span>'
    +'</div>';
  var lista=[];
  DATA.services.forEach(function(s,i){
    var done=isDone(s);
    if(FILT==='dafare'&&done)return;
    if(FILT==='svolti'&&!done)return;
    if(!servizioVisibile(s))return;
    lista.push({s:s,i:i,done:done});
  });
  if(ORD==='autista')lista.sort(function(a,b){var x=a.s.autista||'\uffff',y=b.s.autista||'\uffff';return x===y?a.s.startMin-b.s.startMin:(x<y?-1:1);});
  else if(ORD==='mezzo')lista.sort(function(a,b){var x=a.s.veicolo||'\uffff',y=b.s.veicolo||'\uffff';return x===y?a.s.startMin-b.s.startMin:(x<y?-1:1);});
  else if(ORD==='fornitore')lista.sort(function(a,b){var x=(a.s.fornitore||'zzz').toLowerCase(),y=(b.s.fornitore||'zzz').toLowerCase();return x===y?a.s.startMin-b.s.startMin:(x<y?-1:1);});
  else if(ORD==='scoperti')lista.sort(function(a,b){var x=(!a.s.autista||!a.s.veicolo)?0:1,y=(!b.s.autista||!b.s.veicolo)?0:1;return x===y?a.s.startMin-b.s.startMin:x-y;});
  if(!lista.length)return h+'<div class="vuoto" style="padding:16px">Nessun servizio con i filtri attivi</div>';
  var grp='',prec=null;
  lista.forEach(function(o){
    var s=o.s,i=o.i,done=o.done;
    // in vista 2 giorni la colonna di destra deve aprire il servizio del SUO giorno
    var head;
    if(ORD==='orario')head=s.startMin<0?'SENZA ORARIO':(s.startMin<720?'MATTINA':(s.startMin<1080?'POMERIGGIO':'SERA'));
    else if(ORD==='autista')head=s.autista||'⚠️ SENZA AUTISTA';
    else if(ORD==='mezzo')head=s.veicolo||'⚠️ SENZA MEZZO';
    else if(ORD==='fornitore')head=s.fornitore||'SENZA FORNITORE';
    else head=(!s.autista||!s.veicolo)?'⚠️ DA COPRIRE':'✅ COPERTI';
    if(head!==grp){grp=head;prec=null;
      var hc=(ORD==='autista'&&s.autista)?colorOf(s.autista):((ORD==='mezzo'&&s.veicolo)?colorOfVeicolo(s.veicolo):'#9aa0a6');
      h+='<div style="padding:3px 10px;color:'+hc+';font-size:11px;font-weight:700;margin-top:6px">'+esc(head)+'</div>';}
    var chiaveOrd=ORD==='autista'?'autista':(ORD==='mezzo'?'veicolo':null);
    if(chiaveOrd)h+=connettoreHtml(prec,{s:s,D:DATA},chiaveOrd);
    h+=rigaServizio(o,g2);
    prec={s:s,D:DATA};
  });
  return h;
}

/* Oggi e domani in un elenco solo, raggruppati per autista: sotto ogni nome ci sono
   di seguito i servizi delle due giornate, separati dai connettori, così si vede
   se il giro regge — compreso lo stacco della notte. */
function pannelloUnito(chiave){
  chiave=chiave||'autista';
  var giorni=[{D:DATA,g2:null}];
  if(G2&&PLANS[G2]&&PLANS[G2].services)giorni.push({D:PLANS[G2],g2:G2});
  var items=[],nA=0,nV=0,tot=0,nTot=0;
  giorni.forEach(function(G){
    var salva=DATA;DATA=G.D;
    G.D.services.forEach(function(s,i){
      if(!isCanc(s)){nTot++;if(!s.autista)nA++;if(!s.veicolo)nV++;tot+=eur(s.tariffa);}
      var done=isDone(s);
      if(FILT==='dafare'&&done)return;
      if(FILT==='svolti'&&!done)return;
      if(!servizioVisibile(s))return;
      items.push({s:s,i:i,done:done,D:G.D,g2:G.g2});
    });
    DATA=salva;
  });
  items.sort(function(a,b){
    var x=a.s[chiave]||'\uffff',y=b.s[chiave]||'\uffff';
    if(x!==y)return x<y?-1:1;
    if(a.D.date!==b.D.date)return a.D.date<b.D.date?-1:1;
    return a.s.startMin-b.s.startMin;
  });
  var h='<div class="sommario">'
    +'<span><b>'+nTot+'</b> servizi sui due giorni</span>'
    +(nA?'<span class="chip rosso">'+nA+' senza autista</span>':'<span class="chip verde">autisti ok</span>')
    +(nV?'<span class="chip rosso">'+nV+' senza mezzo</span>':'<span class="chip verde">mezzi ok</span>')
    +'<span style="margin-left:auto">💶 <b>'+tot.toLocaleString('it-IT',{minimumFractionDigits:2})+'€</b></span>'
    +'</div>';
  if(!items.length)return h+'<div class="vuoto" style="padding:16px">Nessun servizio con i filtri attivi</div>';
  var grp=null,prec=null;
  items.forEach(function(o){
    var salva=DATA;DATA=o.D;
    var nome=o.s[chiave]||(chiave==='autista'?'⚠️ SENZA AUTISTA':'⚠️ SENZA MEZZO');
    if(nome!==grp){
      grp=nome;prec=null;
      var c=o.s[chiave]?(chiave==='autista'?colorOf(o.s.autista):colorOfVeicolo(o.s.veicolo)):'#9aa0a6';
      h+='<div style="margin:16px 0 7px;padding:7px 11px;border-left:4px solid '+c+';background:'+c+'14;'
        +'border-radius:0 8px 8px 0;color:'+c+';font-size:13px;font-weight:700">'+esc(nome)+'</div>';
    }
    h+=connettoreHtml(prec,o,chiave);
    h+=rigaServizio(o,o.g2,true);
    prec=o;
    DATA=salva;
  });
  return h;
}

/* Una riga di servizio. Usa il DATA correntemente impostato (in vista unita viene
   scambiato riga per riga), così colori, catene e candidati sono quelli del giorno giusto.
   g2    = data ISO se la riga NON appartiene al giorno ancorato (dove mandare il tocco)
   badge = mostra la targhetta del giorno, serve quando oggi e domani sono in un elenco solo */
function rigaServizio(o,g2,badge){
  var s=o.s,i=o.i,done=o.done,h='';
  var oc=g2?('apriGiorno2('+i+')'):('openModal('+i+')');
  var ar=g2?('assegnaRapido('+i+',\''+g2+'\')'):('assegnaRapido('+i+')');
  var av=g2?('assegnaVeicoloRapido('+i+',\''+g2+'\')'):('assegnaVeicoloRapido('+i+')');
  var tagGiorno=badge?'<span class="chip" style="background:#e3eaf1;color:var(--blu);font-weight:700;white-space:nowrap;padding:1px 7px">'+esc(fmtData(DATA.date))+'</span>':'';
  if(VIEW==='righe'){
    var mancaA=!s.autista, mancaV=!s.veicolo;
    var c, bg, testo, destra;
    if(isCanc(s)){
      c='#b8bfc7'; bg='#eceef1'; testo='#9aa0a6';
      h+='<div onclick="'+oc+'" style="display:flex;gap:8px;padding:8px 10px;margin-bottom:3px;border-radius:8px;background:'+bg+';border-left:4px solid '+c+';align-items:center;font-size:13px;opacity:.7;text-decoration:line-through">'
        +'<b style="min-width:92px;color:'+testo+'">'+s.time+'</b>'
        +'<span style="flex:1;color:'+testo+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.da)+' → '+esc(s.per)+'</span>'
        /* se il segno sta solo nelle Note, dirlo: sul foglio l'Allert è rimasto indietro */
        +'<b style="color:#9aa0a6;white-space:nowrap;text-decoration:none" title="'
          + (String(s.allert||'').indexOf('Cancellato')>=0 ? 'Allert = Cancellato' : esc(s.note||'')) + '">🗑 CANCELLATO'
        + (String(s.allert||'').indexOf('Cancellato')>=0 ? '' : ' <i style="font-style:normal;font-weight:400">· dalle note</i>') + '</b>'
        +'</div>';
      return h;
    }
    if(done){
      c='#b8bfc7'; bg='#e9ebee'; testo='#8a8f96';
      destra='<b style="color:#8a8f96;white-space:nowrap">'+esc(s.autista||'—')+'</b>';
    } else if(mancaA){
      // catena pronta: il miglior autista è già calcolato e assegnabile con un tocco
      var bf=bestFor(s);
      c=mancaV?'#8B0000':'#E24B4A'; bg=mancaV?'#F8D7D7':'#FCEBEB'; testo=mancaV?'#4A0F0F':'#501313';
      // un candidato che oggi NON lavora si vede: grigio e con l'avviso, non verde come
      // gli altri. Prima era indistinguibile e finiva assegnato per sbaglio.
      destra=bf
        ?'<button class="chip" style="border:none;background:'+(bf.inServizio?colorOf(bf.nome):'#8a8f96')+';color:#fff;font-weight:700;white-space:nowrap" title="'+esc(bf.reason)+'" onclick="event.stopPropagation();'+ar+'">'+(bf.inServizio?'➕ ':'➕ ⚠️ ')+esc(bf.nome)+'</button>'
        :'<b style="color:#A32D2D;white-space:nowrap">'+(mancaV?'⛔ MANCA TUTTO':'MANCA AUT.')+'</b>';
    } else if(mancaV){
      // l'autista c'è, manca il mezzo: proponi quello giusto, un tocco e l'hai messo
      var bv=bestVeicoloFor(s);
      c=colorOf(s.autista); bg=c+'26'; testo='#1f2937';
      destra='<b style="color:'+c+';white-space:nowrap">'+esc(s.autista)+'</b> '
        +(bv?'<button class="chip" style="border:none;background:'+colorOfVeicolo(bv.nome)+';color:#fff;font-weight:700;white-space:nowrap" title="'+esc(bv.reason)+'" onclick="event.stopPropagation();'+av+'">🚗 '+esc(bv.nome)+'</button>'
            :'<span class="chip ambra" style="white-space:nowrap">🚗 nessun mezzo libero</span>');
    } else {
      c=colorOf(s.autista); bg=c+'26'; testo='#1f2937';
      destra='<b style="color:'+c+';white-space:nowrap">'+esc(s.autista)+'</b><span style="color:'+testo+';font-size:11px;white-space:nowrap"> · '+esc(s.veicolo)+'</span>';
    }
    // riga su due livelli: sopra orario + tratta completa (va a capo), sotto autista/mezzo
    h+='<div onclick="'+oc+'" style="padding:7px 10px;margin-bottom:3px;border-radius:8px;background:'+bg+';border-left:4px solid '+c+';font-size:13px;'+(done?'opacity:.75;':'')+'">'
      +'<div style="display:flex;gap:8px;align-items:baseline">'
        +'<b style="min-width:92px;color:'+testo+';flex-shrink:0">'+s.time+'→'+fmtMin(s.endMin)+'</b>'
        +'<span style="flex:1;color:'+testo+';font-weight:600">'+esc(s.da)+' → '+esc(s.per)+'</span>'
      +'</div>'
      +'<div style="display:flex;gap:8px;align-items:center;margin-top:3px;padding-left:92px">'
        +tagGiorno
        +'<span style="color:'+testo+';opacity:.8;white-space:nowrap">'+(s.pax||'?')+' pax</span>'
        +(s.nome?'<span style="color:'+testo+';opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.nome)+'</span>':'')
        // su desktop lo spazio c'è: volo, fornitore e tariffa invece di un vuoto in mezzo alla riga
        +(s.volo?'<span class="dsk" style="color:'+testo+';opacity:.6;white-space:nowrap">✈️ '+esc(s.volo)+'</span>':'')
        +(s.fornitore?'<span class="dsk" style="color:'+testo+';opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px">🏨 '+esc(s.fornitore)+'</span>':'')
        +(s.tariffa?'<span class="dsk" style="color:'+testo+';opacity:.75;white-space:nowrap;font-weight:600">💶 '+esc(s.tariffa)+'</span>':'')
        +(PEND[s.id]?'<span title="da salvare">🕐</span>':'')
        +(s.allert?'<span title="allert">📣</span>':'')
        +(s.durSrc&&s.durSrc.indexOf('stima')>=0?'<span title="tempo stimato, non ancora preciso" style="color:'+testo+';opacity:.6">~</span>':'')
        +'<span style="margin-left:auto;text-align:right">'+destra+'</span>'
      +'</div>'
      +(mancaA&&bf?'<div style="font-size:11.5px;color:'+testo+';opacity:.75;padding-left:92px;margin-top:2px">'+esc(bf.reason)+'</div>':'')
      +'</div>';
    return h;
  }
  var warn=!s.autista&&!done;
  var bordoCard=done?'#b8bfc7':(!s.autista&&!s.veicolo?'#8B0000':(!s.autista?'#E24B4A':colorOf(s.autista)));
  var stile='border-left-color:'+bordoCard+';'+(done?'opacity:.55;':'');
  var extra=[];
  if(s.tariffa)extra.push('💶 '+esc(s.tariffa));
  if(s.stato)extra.push('✅ '+esc(s.stato));
  if(s.note)extra.push('📝 '+esc(s.note));
  h+='<div class="card'+(warn?' warn':'')+'" style="'+stile+'" onclick="'+oc+'">'
    +'<div class="top"><span class="ora">'+s.time+' <small>→ '+fmtMin(s.endMin)+'</small></span><span class="chip">'+(s.pax||'?')+' pax</span></div>'
    +'<div class="tratta">'+esc(s.da)+' → '+esc(s.per)+'</div>'
    +'<div class="info" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><span>'
    +(s.nome?'👤 '+esc(s.nome):'')
    +(s.volo?' · ✈️ '+esc(s.volo):'')
    +(s.fornitore?' · 🏨 '+esc(s.fornitore):'')
    +' · ⏱ ~'+fmtDur(s.durMin)
    +'</span>'+azioni(s)+'</div>'
    +'<div class="meta">'
    +chipAut(s.autista)
    +(s.veicolo?'<span class="chip verde">🚗 '+esc(s.veicolo)+'</span>'
      :(function(){var bvc=(s.autista&&!done)?bestVeicoloFor(s):null;return bvc
        ?'<button class="chip" style="border:none;background:'+colorOfVeicolo(bvc.nome)+';color:#fff;font-weight:700" onclick="event.stopPropagation();'+av+'">🚗 + '+esc(bvc.nome)+'</button>'
        :'<span class="chip ambra">⚠️ Senza mezzo</span>';})())
    +(s.allert?'<span class="chip ambra">📣 '+esc(s.allert)+'</span>':'')
    +'</div>'
    +(extra.length?'<div class="extra">'+extra.join(' · ')+'</div>':'')
    +'</div>';
  return h;
}

/* Il collegamento fra due servizi consecutivi dello stesso autista: è questo che fa
   vedere a colpo d'occhio se il giro regge. */
function connettoreHtml(A,B,chiave){
  if(!A||!B)return '';
  chiave=chiave||'autista';
  var a=A.s,b=B.s;
  if(!a[chiave]||a[chiave]!==b[chiave])return '';
  if(a.endMin<0||b.startMin<0)return '';
  var col,txt,bgc;
  if(A.D.date!==B.D.date){
    var notte=(1440-a.endMin)+b.startMin;
    col='#5f6368';bgc='#eceff2';
    txt='🌙 stacco notturno '+fmtDur(notte)+' — chiude '+fmtMin(a.endMin)+' a '+esc(a.per)+', riprende '+fmtMin(b.startMin)+' da '+esc(b.da);
  } else {
    var t=stessoLuogoUI(a.per,b.da)?{min:0,buffer:0}
      :((A.D.transfers&&A.D.transfers[a.id+'->'+b.id])||{min:30,buffer:(A.D.bufferDefault||15)});
    var gap=b.startMin-a.endMin-t.min;
    if(t.min===0&&gap>=0){col='#1e8e3e';bgc='#e6f4ea';txt='📍 stesso posto ('+esc(a.per)+'), '+fmtDur(gap)+' di attesa';}
    else if(gap>=30){col='#1e8e3e';bgc='#e6f4ea';txt='🕳 '+fmtDur(gap)+' liberi (trasf. '+t.min+'m da '+esc(a.per)+' a '+esc(b.da)+')';}
    else if(gap>=0){col='#e37400';bgc='#fef3e0';txt='⏱ stretto: '+fmtDur(gap)+' di margine (trasf. '+t.min+'m)';}
    else {col='#c5221f';bgc='#fce8e6';txt='⛔ non ci arriva: mancano '+fmtDur(-gap)+' (trasf. '+t.min+'m)';}
  }
  return '<div style="display:flex;align-items:center;gap:7px;margin:0 0 3px 16px;font-size:11.5px">'
    +'<span style="width:3px;align-self:stretch;min-height:16px;background:'+col+';border-radius:2px;flex-shrink:0;opacity:.55"></span>'
    +'<span style="background:'+bgc+';color:'+col+';border-radius:6px;padding:3px 8px;font-weight:600">'+txt+'</span>'
    +'</div>';
}


/* ---------- scheda Assegna: i giri a sinistra, la coda a destra ----------
   A sinistra i servizi raggruppati per autista (chi sta lavorando e come è messo),
   a destra quelli ancora da assegnare in ordine di ora. Si tocca un servizio a destra
   e a sinistra ogni autista dice se ci arriva, con quanta attesa e dove si incastra:
   il servizio compare come riga tratteggiata dentro il giro, al suo posto d'orario. */
var SEL_ID=null, ASS_SOLO=true;
/* Su telefono le due colonne non ci stanno affiancate: si vede una per volta e si passa
   dall'altra con i due bottoni in alto (su schermo largo restano tutte e due, i bottoni
   spariscono). Toccando un servizio nella coda si va da soli sui giri: è il gesto vero,
   "questo a chi lo do". */
var ASS_VISTA='coda';
try{if(localStorage.getItem('te_ass_solo')==='0')ASS_SOLO=false;}catch(e){}
function setAssVista(v){ASS_VISTA=v;render();}
function toggleAssSolo(){
  ASS_SOLO=!ASS_SOLO;
  try{localStorage.setItem('te_ass_solo',ASS_SOLO?'1':'0');}catch(e){}
  render();
}
function selezionaSrv(i){
  var s=DATA.services[i];
  if(!s)return;
  if(SEL_ID===s.id){SEL_ID=null;ASS_VISTA='coda';}
  else {SEL_ID=s.id;ASS_VISTA='giri';}
  render();
}
function idxAut(nome){
  for(var i=0;i<DATA.autisti.length;i++)if(DATA.autisti[i].nome===nome)return i;
  return -1;
}
function idxSrv(s){
  for(var i=0;i<DATA.services.length;i++)if(DATA.services[i].id===s.id)return i;
  return -1;
}
/* Assegna dalla scheda: mai il nome dentro l'onclick (gli apostrofi rompono l'HTML),
   solo indici. forza = l'autista ha un conflitto e lo si vuole comunque. */
function assegnaDa(i,ai,forza){
  var s=DATA.services[i],a=DATA.autisti[ai];
  if(!s||!a)return;
  var v=valutaAutista(s,a.nome);
  if(v.k==='off'){toast('🚫 '+a.nome+': '+v.txt);return;}
  if(v.k==='no'&&!forza){toast('⛔ '+a.nome+': '+v.txt);return;}
  PEND[s.id]={autista:a.nome,veicolo:s.veicolo};
  s.autista=a.nome;
  if(SEL_ID===s.id)SEL_ID=null;
  ASS_VISTA='coda';   // sul telefono: assegnato uno, si torna alla coda per il prossimo
  render();
  toast((v.k==='no'?'⚡ forzato: ':'🕐 ')+a.nome+' in sospeso — salva dalla barra in alto');
}

function renderAssegna(){
  var m=document.getElementById('main');
  if(!DATA.services.length){m.innerHTML='<div class="vuoto">Nessun servizio per '+DATA.weekday+' '+DATA.date+'</div>';return;}
  if(SEL_ID&&!srvById(SEL_ID))SEL_ID=null;
  var scoperti=[],senzaMezzo=[];
  DATA.services.forEach(function(s){
    if(isCanc(s))return;
    if(!s.autista)scoperti.push(s);
    else if(!s.veicolo)senzaMezzo.push(s);
  });
  var inServizio=autistiInServizio().length;
  document.body.setAttribute('data-ass',ASS_VISTA);
  var h=barraPend();
  // i due bottoni: solo su telefono, il CSS li nasconde quando le colonne stanno affiancate
  h+='<div class="assswitch">'
    +'<button class="'+(ASS_VISTA==='coda'?'att':'')+'" onclick="setAssVista(\'coda\')">🕐 Da assegnare'
    +(scoperti.length?' <b>'+scoperti.length+'</b>':'')+'</button>'
    +'<button class="'+(ASS_VISTA==='giri'?'att':'')+'" onclick="setAssVista(\'giri\')">🚹 Giri autisti'
    +'</button>'
    +'</div>';
  h+='<div class="sommario">'
    +(scoperti.length?'<span class="chip rosso">'+scoperti.length+' senza autista</span>'
                     :'<span class="chip verde">tutti assegnati</span>')
    +(senzaMezzo.length?'<span class="chip ambra">'+senzaMezzo.length+' senza mezzo</span>':'')
    +'<span class="chip">🚹 '+inServizio+' in servizio oggi</span>'
    +'<button class="chip'+(ASS_SOLO?' verde':'')+'" style="border:none;margin-left:auto" '
    +'title="mostra a sinistra solo gli autisti che oggi hanno servizi" onclick="toggleAssSolo()">'
    +(ASS_SOLO?'👥 Solo chi lavora':'👥 Tutti gli autisti')+'</button>'
    +'</div>';
  h+='<div class="assegna">'+pannelloGiri()+pannelloCoda(scoperti,senzaMezzo)+'</div>';
  m.innerHTML=h;
}

/* ---- colonna destra: la coda, in ordine di ora ---- */
function pannelloCoda(scoperti,senzaMezzo){
  var h='<section class="pane coda"><div class="paneT">🕐 Da assegnare — in ordine di ora'
    +'<span class="paneN">'+scoperti.length+'</span></div>';
  if(!scoperti.length&&!senzaMezzo.length)return h+'<div class="vuoto" style="padding:26px">Niente da assegnare 🎉</div></section>';
  if(!scoperti.length)h+='<div class="vuoto" style="padding:14px">Nessun servizio senza autista</div>';
  scoperti.slice().sort(function(a,b){return a.startMin-b.startMin;}).forEach(function(s){h+=cardCoda(s,false);});
  if(senzaMezzo.length){
    h+='<div class="paneT sub">🚗 Autista sì, mezzo no<span class="paneN">'+senzaMezzo.length+'</span></div>';
    senzaMezzo.slice().sort(function(a,b){return a.startMin-b.startMin;}).forEach(function(s){h+=cardCoda(s,true);});
  }
  return h+'</section>';
}
function cardCoda(s,soloMezzo){
  var i=idxSrv(s),sel=(SEL_ID===s.id),h='';
  var testa='<div class="ccT"><b>'+s.time+'→'+fmtMin(s.endMin)+'</b>'
    +'<span class="chip">'+(s.pax||'?')+' pax</span>'
    // un servizio scoperto di stamattina resta in coda (va comunque sistemato) ma si vede
    // che l'ora è passata: senza l'etichetta sembrava ancora da organizzare
    +(isDone(s)?'<span class="chip" style="background:#eceef1;color:#8a8f96">ora passata</span>':'')
    +(s.tariffa?'<span class="ccEuro">💶 '+esc(s.tariffa)+'</span>':'')
    +(PEND[s.id]?'<span title="da salvare">🕐</span>':'')
    +'</div>'
    +'<div class="ccTratta">'+esc(s.da)+' → '+esc(s.per)+'</div>'
    +'<div class="ccInfo">'+(s.nome?'👤 '+esc(s.nome):'')
      +(s.volo?' · ✈️ '+esc(s.volo):'')+(s.fornitore?' · 🏨 '+esc(s.fornitore):'')
      +' · ⏱ ~'+fmtDur(s.durMin)+'</div>';
  if(soloMezzo){
    var bv=bestVeicoloFor(s);
    h+='<div class="ccard mezzo" onclick="openModal('+i+')">'+testa
      +'<div class="ccBtn">'+chipAut(s.autista)
      +(bv?'<button class="chip" style="border:none;background:'+colorOfVeicolo(bv.nome)+';color:#fff;font-weight:700" title="'+esc(bv.reason)+'" onclick="event.stopPropagation();assegnaVeicoloRapido('+i+')">🚗 '+esc(bv.nome)+'</button>'
          :'<span class="chip ambra">nessun mezzo libero</span>')
      +'</div></div>';
    return h;
  }
  var avA=availability(DATA.autisti,function(sv){return sv.autista;},s);
  var sug=suggest(s,avA,3);
  var btn='';
  sug.forEach(function(c){
    var ai=idxAut(c.nome);
    btn+='<button class="chip" style="border:none;background:'+(c.inServizio?colorOf(c.nome):'#8a8f96')
      +';color:#fff;font-weight:700" title="'+esc(c.reason)+'" onclick="event.stopPropagation();assegnaDa('+i+','+ai+')">'
      +(c.inServizio?'➕ ':'➕ ⚠️ ')+esc(c.nome)+'</button>';
  });
  if(!sug.length)btn='<span class="chip rosso">nessun autista libero: guarda a sinistra chi forzare</span>';
  h+='<div class="ccard'+(sel?' sel':'')+'" onclick="selezionaSrv('+i+')">'+testa
    +'<div class="ccBtn">'+btn+'</div>'
    +(sug.length?'<div class="ccWhy">'+esc(sug[0].reason)+'</div>':'')
    +'<div class="ccPie">'+(sel?'✓ selezionato — a sinistra vedi dove si incastra':'tocca per vedere a chi darlo')
    +'<button class="chip" style="border:none;margin-left:auto" onclick="event.stopPropagation();openModal('+i+')">✏️ scheda</button></div>'
    +'</div>';
  return h;
}

/* ---- colonna sinistra: i giri, un blocco per autista ---- */
function pannelloGiri(){
  var S=SEL_ID?srvById(SEL_ID):null;
  var h='<section class="pane giri"><div class="paneT">'
    +'<button class="tornaCoda" onclick="setAssVista(\'coda\')">◀ Coda</button>'
    +'🚹 Giri degli autisti'
    +(S?'<span class="paneSel">per le '+S.time+' '+esc(S.da)+' → '+esc(S.per)+'</span>':'')
    +'</div>';
  // su telefono l'intestazione scorre via: il servizio scelto va ripetuto qui, fisso in alto
  if(S)h+='<div class="selBanner">🧩 <b>'+S.time+'</b> '+esc(S.da)+' → '+esc(S.per)
    +' · '+(S.pax||'?')+' pax'
    +'<button class="chip" style="border:none;margin-left:auto" onclick="selezionaSrv('+idxSrv(S)+')">✕ togli</button>'
    +'</div>';
  var lista=ordineAutisti(S),nascosti=0,corpo='';
  lista.forEach(function(o){
    if(ASS_SOLO&&!o.mine.length){nascosti++;return;}
    corpo+=boxAutista(o,S);
  });
  if(!corpo)corpo='<div class="vuoto" style="padding:22px">Nessun autista con servizi in giornata</div>';
  h+=corpo;
  if(nascosti)h+='<div class="giriPie"><button class="chip" style="border:none" onclick="toggleAssSolo()">'
    +'👥 mostra anche i '+nascosti+' che oggi non lavorano</button></div>';
  return h+'</section>';
}
/* Ordine dei blocchi: senza selezione per ora di inizio giro, con un servizio
   selezionato per quanto bene ci sta (prima chi ci arriva, ultimi gli impegnati). */
function ordineAutisti(S){
  var out=[];
  DATA.autisti.forEach(function(a,ai){
    var mine=giroDi(a.nome,S?S.id:null);
    var v=S?valutaAutista(S,a.nome):null;
    var key=v?punteggioAutista(a,v)
             :((mine.length?mine[0].startMin:99000)+(a.esclusoMotivo?900000:0));
    out.push({a:a,ai:ai,mine:mine,v:v,key:key});
  });
  out.sort(function(x,y){return x.key-y.key||(x.a.nome<y.a.nome?-1:1);});
  return out;
}
function boxAutista(o,S){
  var c=colorOf(o.a.nome),v=o.v;
  var ore=0;o.mine.forEach(function(s){ore+=Math.max(0,s.durMin||0);});
  var riass=o.mine.length
    ? o.mine.length+' srv · '+fmtMin(o.mine[0].startMin)+'→'+fmtMin(o.mine[o.mine.length-1].endMin)+' · '+fmtDur(ore)+' guidati'
    : (o.a.esclusoMotivo?esc(o.a.esclusoMotivo):'oggi nessun servizio');
  var h='<div class="autbox'+(v?' v-'+v.k:'')+'" style="border-left-color:'+c+'">'
    +'<div class="autT"><span class="autNome" style="color:'+c+'">'+esc(o.a.nome)+'</span>'
    +(o.a.categoria?'<span class="autCat">'+esc(o.a.categoria)+'</span>':'')
    +'<span class="autN">'+riass+'</span>'
    +(S?bottoneAssegna(o,S):'')
    +'</div>';
  if(v)h+='<div class="autV">'+segnoFatt(v.k)+' '+esc(v.txt||'')+'</div>';
  h+=giroHtml(o.mine,S,v);
  return h+'</div>';
}
function segnoFatt(k){
  return {ok:'✅',stretto:'⏱',fermo:'🌙',libero:'🆓',no:'⛔',off:'🚫'}[k]||'';
}
function bottoneAssegna(o,S){
  var v=o.v,i=idxSrv(S);
  if(!v||i<0)return '';
  if(v.k==='off')return '<span class="chip" style="background:#eef1f4;color:#9aa0a6">🚫 non disponibile</span>';
  if(v.k==='no')return '<button class="chip ambra" style="border:none" title="ha un conflitto: assegna comunque" onclick="assegnaDa('+i+','+o.ai+',true)">⚡ Forza</button>';
  var st=(v.k==='ok')?'background:var(--verde);color:#fff'
        :(v.k==='stretto'?'background:var(--ambra);color:#fff':'background:#8a8f96;color:#fff');
  return '<button class="chip" style="border:none;font-weight:700;'+st+'" onclick="assegnaDa('+i+','+o.ai+')">➕ Assegna</button>';
}
/* Il giro dell'autista, con il servizio selezionato inserito al suo posto d'orario
   come riga tratteggiata: è lì che si vede se regge. */
function giroHtml(mine,S,v){
  var h='',inserito=false,i,prec=null,salta=false;
  var ghost=!!(S&&v&&FATT_OK[v.k]);
  for(i=0;i<mine.length;i++){
    if(ghost&&!inserito&&S.startMin<mine[i].startMin){h+=ghostRiga(S,v);inserito=true;salta=true;}
    if(prec&&!salta)h+=divarioHtml(prec,mine[i]);
    salta=false;
    h+=srvRigaMini(mine[i]);
    prec=mine[i];
  }
  if(ghost&&!inserito)h+=ghostRiga(S,v);
  if(!mine.length&&!ghost)h+='<div class="srvvuoto">— nessun servizio in giornata —</div>';
  return h;
}
/* Quanto vuoto (o quanto rosso) c'è fra due servizi già assegnati allo stesso autista:
   è quello che dice se il giro regge, senza aprire la scheda Servizi. */
function divarioHtml(a,b){
  if(a.endMin<0||b.startMin<0)return '';
  var t=trf(a.id,b.id);
  var gap=b.startMin-a.endMin-t.min,col,txt;
  if(t.min===0&&gap>=0){col='#1e8e3e';txt='📍 stesso posto · '+fmtDur(gap)+' di attesa';}
  else if(gap>=30){col='#1e8e3e';txt='🕳 '+fmtDur(gap)+' liberi · trasf. '+t.min+'m';}
  else if(gap>=0){col='#e37400';txt='⏱ stretto: '+fmtDur(gap)+' · trasf. '+t.min+'m';}
  else {col='#c5221f';txt='⛔ non ci arriva: mancano '+fmtDur(-gap);}
  return '<div class="divario" style="color:'+col+'">'+txt+'</div>';
}
function srvRigaMini(s){
  var i=idxSrv(s);
  return '<div class="srvmini" onclick="openModal('+i+')">'
    +'<b>'+s.time+'→'+fmtMin(s.endMin)+'</b>'
    +'<span class="srvT">'+esc(s.da)+' → '+esc(s.per)+'</span>'
    +(s.veicolo?'<span class="chip" style="background:'+colorOfVeicolo(s.veicolo)+'22;color:'+colorOfVeicolo(s.veicolo)+'">🚗 '+esc(s.veicolo)+'</span>'
               :'<span class="chip ambra">senza mezzo</span>')
    +'</div>';
}
function ghostRiga(S,v){
  var det=[];
  if(v.attesaPrima!==null&&v.prev)det.push('⏱ '+fmtDur(v.attesaPrima)+' dopo '+esc(v.prev.per));
  if(v.margineDopo!==null&&v.next)det.push('➡️ '+fmtDur(v.margineDopo)+' prima di '+esc(v.next.da));
  if(!det.length)det.push(v.k==='libero'?'unico servizio della giornata':esc(v.txt||''));
  return '<div class="srvmini ghost">'
    +'<b>'+S.time+'→'+fmtMin(S.endMin)+'</b>'
    +'<span class="srvT">'+esc(S.da)+' → '+esc(S.per)+'</span>'
    +'<span class="ghostM">'+det.join(' · ')+'</span>'
    +'</div>';
}

function openModal(i){
  CUR=DATA.services[i];MODAL_OPEN=true;
  var s=CUR;
  var avA=availability(DATA.autisti,function(sv){return sv.autista;},s,'autista');
  var avV=availability(DATA.veicoli,function(sv){return sv.veicolo;},s,'veicolo');
  var sug=suggest(s,avA);

  /* Chi oggi non lavora sta in un gruppo suo, in fondo: mescolato ai «Disponibili»
     veniva scelto per sbaglio, ed è il difetto segnalato il 18/08. */
  function optA(){
    var top='',lib='',fermi='',occ='',ind='';
    sug.forEach(function(c){
      top+='<option value="'+esc(c.nome)+'">'+(c.inServizio?'':'⚠️ ')+esc(c.nome)+(c.cat?' ('+esc(c.cat)+')':'')+' — '+esc(c.reason)+'</option>';
    });
    DATA.autisti.forEach(function(a){
      var sel=a.nome===s.autista?' selected':'';
      var label=a.nome+(a.categoria?' ('+a.categoria+')':'');
      if(a.esclusoMotivo){ind+='<option value="'+esc(a.nome)+'"'+sel+'>'+esc(label)+' — '+a.esclusoMotivo+'</option>';return;}
      var w=avA[a.nome];
      if(w){var rit=w.freeAt-s.startMin;occ+='<option value="'+esc(a.nome)+'"'+sel+' data-rit="'+rit+'">'+esc(label)+' — libero ~'+fmtMin(w.freeAt)+' ('+esc(w.con.per)+')</option>';return;}
      var v=valutaAutista(s,a.nome);
      var riga='<option value="'+esc(a.nome)+'"'+sel+'>'+esc(label)+(v.txt?' — '+esc(v.txt):'')+'</option>';
      if(v.inServizio)lib+=riga;else fermi+=riga;
    });
    return '<option value="">— nessuno —</option>'
      +(top?'<optgroup label="🔝 Consigliati">'+top+'</optgroup>':'')
      +(lib?'<optgroup label="✅ Disponibili — già in servizio oggi">'+lib+'</optgroup>':'')

      +(fermi?'<optgroup label="💤 Oggi non lavorano">'+fermi+'</optgroup>':'')
      +(ind?'<optgroup label="🚫 Non disponibili oggi">'+ind+'</optgroup>':'');

  function optV(){
    var lib='',occ='',cap='',fs='';
    DATA.veicoli.forEach(function(v){
      var sel=v.nome===s.veicolo?' selected':'';
      var label=v.nome+' · '+v.tipo+' · '+v.pax+' posti';
      var isCur=v.nome===s.veicolo;
      if(v.inRent){fs+='<option value="'+esc(v.nome)+'"'+(isCur?sel:' disabled')+'>'+esc(label)+' — a noleggio</option>';return;}
      if(v.fuoriServizio){fs+='<option value="'+esc(v.nome)+'"'+(isCur?sel:' disabled')+'>'+esc(label)+' — '+v.stato+'</option>';return;}
      var w=avV[v.nome];
      // smart: se il mezzo è impegnato su un servizio dello STESSO autista di questo transfer,
      // viaggiano insieme: la fattibilità è già quella dell'autista → consideralo disponibile
      if(w&&w.con&&w.con.autista&&s.autista&&w.con.autista===s.autista)w=null;
      var small=s.pax>0&&v.pax>0&&v.pax<s.pax;
      if(w){var ritV=w.freeAt-s.startMin;occ+='<option value="'+esc(v.nome)+'"'+sel+' data-rit="'+ritV+'">'+esc(label)+' — libero ~'+fmtMin(w.freeAt)+(w.con.autista?' (con '+esc(w.con.autista)+')':'')+'</option>';}
      else if(small)cap+='<option value="'+esc(v.nome)+'"'+sel+'>'+esc(label)+' — solo '+v.pax+' posti per '+s.pax+' pax</option>';
      else lib+='<option value="'+esc(v.nome)+'"'+sel+'>'+esc(label)+'</option>';
    });
    return '<option value="">— nessuno —</option>'
      +(lib?'<optgroup label="✅ Disponibili e adatti">'+lib+'</optgroup>':'')

    +'<label>Allert / Recap'+(s.allert?' <span style="font-weight:400;color:var(--grigio)">(attuale: '+esc(s.allert)+')</span>':'')+'</label>'
    +'<div class="btnrow" style="margin-top:4px">'

    +'</div>'

    +(s.stato==='Eseguito'
      ?'<button class="annulla" onclick="doStato(\'\')">↩️ Togli eseguito</button>'
      :'<button class="annulla" style="background:#e6f4ea;color:var(--verde)" onclick="doStato(\'Eseguito\')">✅ Eseguito</button>')
    +'<button class="annulla" style="background:#fce8e6;color:var(--rosso)" onclick="doAllert(\'Cancellato\')">🗑 Cancella</button>'
    +'</div>'

    +'<b style="font-size:13px;color:var(--blu)">✏️ Dettagli servizio</b>'

function warnCheck(){
  ['A','V'].forEach(function(k){
    var sel=document.getElementById('sel'+k),w=document.getElementById('w'+k);
    if(!sel||!w)return;
    var o=sel.options[sel.selectedIndex];w.className='avviso';w.textContent='';

    else if(g.indexOf('Non disponibili')>=0){w.className='avviso rosso';w.textContent='🚫 Selezione forzata: segnato come non disponibile.';}

  });

function closeModal(){document.getElementById('ovl').style.display='none';document.getElementById('modal').style.display='none';CUR=null;MODAL_OPEN=false;}
/* pulsanti azione: salvano subito la riga (se modificata) e chiamano DIRETTAMENTE
   il webhook Promemoria n8n → notifica istantanea al driver.
   'Non Inviare' scrive solo la cella. 'Cancellato' = soft delete + notifica. */
function doAllert(val){
  if(!CUR)return;
  var svc=CUR;
  if(val==='Cancellato'&&!confirm('🗑 Cancellare questo servizio (soft delete) e avvisare il driver?'))return;
  var selA=document.getElementById('selA'),selV=document.getElementById('selV');
  var a=selA?selA.value:svc.autista, v=selV?selV.value:svc.veicolo;
  var cambiato=(a!==svc.autista)||(v!==svc.veicolo)||!!PEND[svc.id];
  var prev={autista:svc.autista,veicolo:svc.veicolo};
  // se il pannello Dettagli contiene modifiche non salvate, le salva prima di notificare
  var mod=null;
  if(document.getElementById('edDa')){
    var g=function(id){var el=document.getElementById(id);return el?el.value:'';};
    var cand={dateISO:g('edData'),time:g('edOra'),pax:g('edPax'),da:g('edDa'),per:g('edPer'),nome:g('edNome'),volo:g('edVolo'),fornitore:g('edForn'),cell:g('edCell'),tariffa:g('edTar'),acconto:g('edAcc'),modalita:g('edMod'),hextra:g('edHex'),note:g('edNote')};
    var dett=(cand.da!==svc.da)||(cand.per!==svc.per)||(svc.startMin>=0&&cand.time!==svc.time)||(String(cand.pax||'')!==String(svc.pax||''))||(cand.nome!==svc.nome)||(cand.volo!==svc.volo)||(cand.fornitore!==svc.fornitore)||(cand.note!==svc.note)||(cand.dateISO!==DATA.date)||(cand.modalita!==(svc.modalita||''))||(cand.hextra!==(svc.hextra||''));
    if(dett)mod=cand;
  }
  delete PEND[svc.id];
  svc.autista=a;svc.veicolo=v;svc.allert=val;
  if(mod){
    svc.da=mod.da||svc.da;svc.per=mod.per||svc.per;svc.nome=mod.nome;svc.volo=mod.volo;
    svc.fornitore=mod.fornitore;svc.note=mod.note;
    if(mod.pax)svc.pax=+mod.pax;
    if(mod.time)svc.time=mod.time;
  }
  closeModal();render();
  toast(val==='Non Inviare'?'🔕 Imposto Non Inviare…':(mod?'💾 Salvo modifiche e notifico…':'📣 Notifica '+val+' in partenza…'));
  function fire(){
    if(val==='Non Inviare'){
      google.script.run.withSuccessHandler(function(){toast('🔕 Impostato Non Inviare');load(true);})
        .withFailureHandler(function(e){toast('❌ NON impostato: '+e.message);load(true);})
        .setAllert(svc.id,'Non Inviare');
    } else {
      google.script.run.withSuccessHandler(function(r){toast(r.ok?'✅ Notifica '+val+' inviata al driver':'⚠️ Webhook HTTP '+r.http);load(true);})
        .withFailureHandler(function(e){toast('❌ Notifica NON inviata: '+e.message);load(true);})
        .notificaOra(svc.id,val);
    }
  }
  function step2(){
    if(cambiato){
      google.script.run.withSuccessHandler(fire)
        .withFailureHandler(function(e){toast('❌ NON salvato: '+e.message);load(true);})
        .assignService(svc.id,a,v,prev,true);
    } else fire();
  }
  if(mod){
    google.script.run.withSuccessHandler(step2)
      .withFailureHandler(function(e){toast('❌ Dettagli NON salvati: '+e.message);load(true);})
      .updateService(svc.id,mod);
  } else step2();
}

/* ---------- stato per flotta e timeline ---------- */
function statusOf(list,keyFn){
  var now=DATA.nowMin;
  return list.map(function(item){
    var mine=DATA.services.filter(function(sv){return !isCanc(sv)&&keyFn(sv)===item.nome&&sv.startMin>=0;}).sort(function(a,b){return a.startMin-b.startMin;});
    var cur=null,next=null;
    if(now>=0){
      mine.forEach(function(sv){
        if(sv.startMin<=now&&now<sv.endMin&&!cur)cur=sv;
        if(sv.startMin>now&&!next)next=sv;
      });
    } else if(mine.length) next=mine[0];
    return {item:item,cur:cur,next:next,n:mine.length,mine:mine};
  });
}
/* ---------- rientro in garage ----------
   Un mezzo che stacca a Monopoli alle 15:30 non è in sede alle 15:30: lo è dopo il
   rientro alla base. Il backend manda rientroMin su ogni servizio (minuti dal drop-off
   a Polignano, presi da _CacheTratte). Qui si calcola l'ora di rientro effettiva. */
function garageInfo(mine){
  if(!mine||!mine.length)return null;
  var last=null;
  mine.forEach(function(s){if(s.endMin>=0&&(!last||s.endMin>last.endMin))last=s;});
  if(!last)return null;
  // rientroMin assente = backend vecchio o deployment non aggiornato: meglio non dire nulla
  // che affermare che il mezzo è già in sede
  if(last.rientroMin===undefined||last.rientroMin===null)return null;
  var r=Math.max(0,Math.round(+last.rientroMin||0));
  return {at:last.endMin+r,min:r,from:last.per,last:last};
}
function garageHtml(mine){
  var g=garageInfo(mine);if(!g)return '';
  var now=DATA.nowMin;
  var quando=(now>=0)?(g.at>now?' · tra '+fmtDur(g.at-now):' · già rientrato'):'';
  var det=g.min>0
    ?'ultimo stacco '+fmtMin(g.last.endMin)+' a '+esc(g.last.per)+' + '+g.min+'m di rientro'
    :'l\'ultimo servizio termina già in sede';
  return '<div style="margin-top:7px;padding-top:6px;border-top:1px dashed #e4e7eb;font-size:12.5px;color:var(--grigio)">'
    +'<b style="color:var(--blu)">🏠 In garage alle '+fmtMin(g.at)+'</b><span style="opacity:.85">'+quando+'</span>'
    +'<div style="font-size:11.5px;opacity:.75;margin-top:1px">'+det+'</div></div>';
}
function statusChip(st){
  var a=st.item,now=DATA.nowMin;
  if(a.esclusoMotivo)return '<span class="chip rosso">🚫 '+esc(a.esclusoMotivo)+'</span>';
  if(a.inRent)return '<span class="chip ambra">🔑 a noleggio</span>';
  if(a.fuoriServizio)return '<span class="chip rosso">🚫 Fuori servizio</span>';
  if(st.cur&&now>=0){
    var h='<span class="chip ambra"><span class="clessidra">⏳</span> stacca tra '+fmtDur(st.cur.endMin-now)+' (alle '+fmtMin(st.cur.endMin)+(st.cur.per?' a '+esc(st.cur.per):'')+')</span>';
    // se dopo questo non ha altri servizi, torna in base: è lì che è davvero disponibile
    if(!st.next){
      var g=garageInfo(st.mine);
      if(g&&g.min>0)h+=' <span class="chip">🏠 in garage '+fmtMin(g.at)+'</span>';
    }
    return h;
  }
  if(st.next&&now>=0)return '<span class="chip verde">🟢 libero per '+fmtDur(st.next.startMin-now)+' (fino alle '+fmtMin(st.next.startMin)+')</span>';
  if(st.next)return '<span class="chip">primo servizio: '+st.next.time+'</span>';
  return '<span class="chip verde">🟢 libero'+(st.n?'':' tutto il giorno')+'</span>';
}

/* Chi compare in Flotta e in Timeline. Prima la condizione era
   `categoria valida && in elenco || esclusoMotivo===''`: per la precedenza di && su ||
   bastava non avere motivi di esclusione per entrare, e un autista escluso con categoria
   non riconosciuta spariva. Ora la regola è una sola, usata da entrambe le viste. */
var CAT_OPERATIVE=['fisso','extra','tuk-tuk','emergenza'];
function isOperativo(a){
  var c=String(a.categoria||'').toLowerCase().trim();
  return c?CAT_OPERATIVE.indexOf(c)>=0:true;
}

/* ---------- vista flotta ----------
   Prima ogni mezzo aveva lo stesso bordo grigio: occupato e libero si somigliavano.
   Ora lo stato guida colore, bordo, sfondo e ordine, e per ogni mezzo si vede
   CHI lo sta usando e QUANDO si libera. */
var FFILT='';
function setFFilt(k){FFILT=(FFILT===k?'':k);render();}

function statoDi(st,isDriver){
  var a=st.item,now=DATA.nowMin;
  if(isDriver&&a.esclusoMotivo)   return {k:'off',col:'#8a8f96',bg:'#f1f3f5',badge:'🚫 '+esc(a.esclusoMotivo)};
  if(!isDriver&&a.inRent)         return {k:'off',col:'#e37400',bg:'#fff6e8',badge:'🔑 A NOLEGGIO'};
  if(!isDriver&&a.fuoriServizio)  return {k:'off',col:'#8a8f96',bg:'#f1f3f5',badge:'🚫 FUORI SERVIZIO'};
  if(now<0)return st.n?{k:'prog',col:'#0b3d66',bg:'#edf2f7',badge:'📋 '+st.n+' serviz'+(st.n===1?'io':'i')}
                      :{k:'lib', col:'#1e8e3e',bg:'#eef8f1',badge:'🟢 NESSUN SERVIZIO'};
  if(st.cur)                      return {k:'occ',col:'#c5221f',bg:'#fdeded',badge:'🔴 OCCUPATO'};
  return {k:'lib',col:'#1e8e3e',bg:'#eef8f1',badge:'🟢 LIBERO'};
}

/* elenco dei servizi con, riga per riga, la controparte:
   su un mezzo si vede l'autista, su un autista si vede il mezzo */
function scheduleHtml(mine,colore,contro){
  if(!mine.length)return '';
  var h='<div style="margin-top:8px;font-size:12.5px;line-height:1.65">';
  for(var i=0;i<mine.length;i++){
    var sv=mine[i];
    var c=contro?String(sv[contro]||'').trim():'';
    h+='<div><span style="color:'+colore+';font-weight:700">'+fmtMin(sv.startMin)+'–'+fmtMin(sv.endMin)+'</span> '
      +esc(sv.da)+' → '+esc(sv.per)
      +(c?'<span style="color:var(--grigio)"> · '+(contro==='autista'?'🚹 ':'🚗 ')+esc(c)+'</span>'
         :'<span style="color:var(--rosso)"> · ⚠️ '+(contro==='autista'?'senza autista':'senza mezzo')+'</span>')
      +'</div>';
    if(i<mine.length-1){
      var nx=mine[i+1],t=trf(sv.id,nx.id);
      var gap=nx.startMin-sv.endMin-t.min,cls,txt;
      if(t.min===0&&gap>=0){cls='verde';txt='📍 stesso posto, '+fmtDur(gap)+' di attesa';}
      else if(gap>=30){cls='verde';txt='🕳 buco utile '+fmtDur(gap)+' ('+fmtMin(sv.endMin)+'–'+fmtMin(nx.startMin)+', trasf. '+t.min+'m)';}
      else if(gap>=0){cls='ambra';txt='⏱ stretto: solo '+fmtDur(gap)+' liberi (trasf. '+t.min+'m)';}
      else{cls='rosso';txt='⛔ incastro impossibile: mancano '+fmtDur(-gap)+' (trasf. '+t.min+'m)';}
      h+='<div style="margin:3px 0"><span class="chip '+cls+'">'+txt+'</span></div>';
    }
  }
  return h+'</div>';
}

function renderFlotta(){
  var m=document.getElementById('main');
  var oggi=DATA.nowMin>=0;
  var A=statusOf(DATA.autisti.filter(isOperativo),function(sv){return sv.autista;});
  var V=statusOf(DATA.veicoli,function(sv){return sv.veicolo;});
  A.forEach(function(st){st.stato=statoDi(st,true);});
  V.forEach(function(st){st.stato=statoDi(st,false);});
  var n={occ:0,lib:0,prog:0,off:0};
  A.concat(V).forEach(function(st){n[st.stato.k]++;});

  function fchip(k,label,num,col,bg){
    if(!num)return '';
    var att=FFILT===k;
    return '<button class="chip" style="border:none;white-space:nowrap;'
      +(att?'background:'+col+';color:#fff;font-weight:700':'background:'+bg+';color:'+col+';font-weight:600')
      +'" onclick="setFFilt(\''+k+'\')">'+label+' <b>'+num+'</b></button>';
  }
  var h='';
  if(!oggi)h+='<div class="sommario" style="background:#edf2f7"><span>📅 Programma di <b>'+esc(fmtDataLunga(DATA.date))+'</b> — non è oggi, niente countdown</span></div>';
  h+='<div class="sommario">'
    +fchip('occ','🔴 Impegnati ora',n.occ,'#c5221f','#fdeded')
    +fchip('lib',oggi?'🟢 Liberi ora':'🟢 Senza servizi',n.lib,'#1e8e3e','#eef8f1')
    +fchip('prog','📋 Con servizi',n.prog,'#0b3d66','#edf2f7')
    +fchip('off','🚫 Non disponibili',n.off,'#8a8f96','#f1f3f5')
    +(FFILT?'<button class="chip" style="border:none;margin-left:auto" onclick="setFFilt(\''+FFILT+'\')">✕ mostra tutti</button>':'')
    +'</div>';

  var ORDINE=[['occ','🔴 Impegnati ora'],['lib',oggi?'🟢 Liberi ora':'🟢 Senza servizi'],
              ['prog','📋 Con servizi programmati'],['off','🚫 Non disponibili']];
  function blocco(list,isDriver){
    var out='',vuoto=true;
    ORDINE.forEach(function(g){
      if(FFILT&&FFILT!==g[0])return;
      var righe=list.filter(function(st){return st.stato.k===g[0];})
                    .sort(function(x,y){return x.item.nome.localeCompare(y.item.nome);});
      if(!righe.length)return;
      vuoto=false;
      out+='<div class="sez sub">'+g[1]+' <span style="opacity:.6">('+righe.length+')</span></div>';
      righe.forEach(function(st){out+=flRow(st,isDriver);});
    });
    return vuoto?'<div class="vuoto" style="padding:14px">Nessuno in questo stato</div>':out;
  }
  h+='<div class="sez">🚹 Autisti</div>'+blocco(A,true);
  h+='<div class="sez">🚗 Mezzi</div>'+blocco(V,false);
  m.innerHTML=h;
}

function flRow(st,isDriver){
  var a=st.item,now=DATA.nowMin,S=st.stato;
  var tinta=isDriver?colorOf(a.nome):colorOfVeicolo(a.nome);
  var contro=isDriver?'veicolo':'autista';           // cosa mostrare come controparte
  var etichetta=isDriver?'🚗 ':'🚹 ';
  var dot=isDriver
    ?'<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:'+tinta+';margin-right:6px;vertical-align:middle"></span>'
    :'<span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:'+tinta+';margin-right:6px;vertical-align:middle"></span>';

  // riga di stato: cosa sta facendo adesso, con chi, e quando si libera
  var corpo='';
  if(S.k==='occ'&&st.cur){
    var pct=Math.max(2,Math.min(100,Math.round((now-st.cur.startMin)/Math.max(1,st.cur.durMin)*100)));
    var conChi=String(st.cur[contro]||'').trim();
    corpo+='<div class="bar" style="display:block;margin-top:9px"><i style="width:'+pct+'%"></i></div>'
      +'<div style="font-size:13px;margin-top:6px;color:#202124"><b>'+esc(st.cur.da)+' → '+esc(st.cur.per)+'</b>'
      +(conChi?'<span style="color:var(--grigio)"> · '+etichetta+esc(conChi)+'</span>':'')+'</div>'
      +'<div style="font-size:12.5px;color:var(--rosso);font-weight:600;margin-top:3px">'
      +'si libera alle '+fmtMin(st.cur.endMin)+' a '+esc(st.cur.per)+' · fra '+fmtDur(st.cur.endMin-now)+'</div>';
    if(st.next)corpo+='<div style="font-size:12px;color:var(--grigio);margin-top:2px">poi '+st.next.time+' '+esc(st.next.da)+' → '+esc(st.next.per)+'</div>';
  } else if(S.k==='lib'&&st.next&&now>=0){
    var conP=String(st.next[contro]||'').trim();
    corpo+='<div style="font-size:12.5px;margin-top:7px;color:var(--verde);font-weight:600">libero per '+fmtDur(st.next.startMin-now)+'</div>'
      +'<div style="font-size:12.5px;color:var(--grigio);margin-top:2px">poi alle '+st.next.time+': '+esc(st.next.da)+' → '+esc(st.next.per)
      +(conP?' · '+etichetta+esc(conP):'')+'</div>';
  } else if(S.k==='lib'&&!st.n){
    corpo+='<div style="font-size:12.5px;margin-top:7px;color:var(--grigio)">nessun servizio in giornata</div>';
  }

  var sotto=esc(a.categoria||a.tipo||'')+(a.pax?' · '+a.pax+' posti':'')+(st.n?' · '+st.n+' serviz'+(st.n===1?'io':'i')+' oggi':'');
  return '<div class="fl" style="border-left:5px solid '+S.col+';background:'+S.bg+'">'
    +'<div class="riga"><div><div class="nome">'+dot+esc(a.nome)+'</div><div class="cat">'+sotto+'</div></div>'
    +'<div class="st"><span class="chip" style="background:'+S.col+';color:#fff;font-weight:700;white-space:nowrap">'+S.badge+'</span></div></div>'
    +corpo
    +(S.k==='off'?'':scheduleHtml(st.mine,tinta,contro)+garageHtml(st.mine))
    +'</div>';
}

/* ---------- vista timeline ---------- */
function renderTimeline(){
  var m=document.getElementById('main');
  var withSrv=DATA.services.filter(function(s){return s.startMin>=0&&!isCanc(s);});
  if(!withSrv.length){m.innerHTML='<div class="vuoto">Nessun servizio con orario per '+DATA.date+'</div>';return;}
  var minS=1440,maxS=0;
  // la scala arriva fino al rientro in base, altrimenti l'ultimo tratto resta tagliato fuori
  withSrv.forEach(function(s){if(s.startMin<minS)minS=s.startMin;var e=s.endMin+(s.rientroMin||0);if(e>maxS)maxS=e;});
  var h0=Math.min(6,Math.floor(minS/60)),h1=Math.max(22,Math.min(24,Math.ceil((maxS+60)/60)));
  var span=(h1-h0)*60;
  function pct(min){return Math.max(0,Math.min(100,(min-h0*60)/span*100));}
  function assi(){
    var t='<div class="tlassi">',step=(h1-h0)>12?4:2;
    for(var hh=h0;hh<=h1;hh+=step)t+='<span>'+('0'+hh).slice(-2)+'</span>';
    return t+'</div>';
  }
  var h='<div class="legenda">'
    +'<span><span class="sw" style="background:#4363d8"></span>servizio</span>'
    +'<span><span class="sw" style="background:#4363d877"></span>trasferimento</span>'
    +'<span><span class="sw" style="background:#c9ccd1"></span>attesa</span>'
    +'<span><span class="sw" style="background:repeating-linear-gradient(45deg,#4363d8aa,#4363d8aa 3px,transparent 3px,transparent 6px)"></span>rientro in garage</span>'
    +'<span><span class="sw" style="background:var(--rosso);width:3px;height:14px"></span>adesso</span>'
    +'</div>';

  function bars(mine,colore){
    var b='<div class="tlbar">';
    for(var i=0;i<mine.length;i++){
      var sv=mine[i];
      b+='<div class="tlseg" style="left:'+pct(sv.startMin)+'%;width:'+Math.max(1.2,pct(sv.endMin)-pct(sv.startMin))+'%;background:'+colore+';border-radius:4px" title="'+esc(sv.da)+' → '+esc(sv.per)+'"></div>';
      if(i<mine.length-1){
        var nx=mine[i+1],t=trf(sv.id,nx.id);
        var tEnd=Math.min(sv.endMin+t.min,nx.startMin);
        if(tEnd>sv.endMin)b+='<div class="tlseg" style="left:'+pct(sv.endMin)+'%;width:'+(pct(tEnd)-pct(sv.endMin))+'%;background:'+colore+'77;border-radius:0"></div>';
        if(nx.startMin>tEnd)b+='<div class="tlseg" style="left:'+pct(tEnd)+'%;width:'+(pct(nx.startMin)-pct(tEnd))+'%;background:#c9ccd1;top:8px;bottom:8px;border-radius:2px"></div>';
      }
    }
    // tratta di rientro alla base dopo l'ultimo servizio
    var g=garageInfo(mine);
    if(g&&g.min>0)b+='<div class="tlseg" style="left:'+pct(g.last.endMin)+'%;width:'+Math.max(0.6,pct(g.at)-pct(g.last.endMin))+'%;background:repeating-linear-gradient(45deg,'+colore+'aa,'+colore+'aa 3px,transparent 3px,transparent 6px);border-radius:0 4px 4px 0" title="rientro in garage — in sede alle '+fmtMin(g.at)+'"></div>';
    if(DATA.nowMin>=h0*60&&DATA.nowMin<=h1*60)b+='<div class="tlnow" style="left:'+pct(DATA.nowMin)+'%"></div>';
    return b+'</div>'+assi();
  }
  function riepilogo(mine){
    var parts=[];
    for(var i=0;i<mine.length;i++){
      var sv=mine[i];
      parts.push('<b>'+fmtMin(sv.startMin)+'–'+fmtMin(sv.endMin)+'</b> '+esc(sv.da)+'→'+esc(sv.per));
      if(i<mine.length-1){
        var nx=mine[i+1],t=trf(sv.id,nx.id);
        var gap=nx.startMin-sv.endMin-t.min;
        var col=gap>=30?'var(--verde)':(gap>=0?'var(--ambra)':'var(--rosso)');
        parts.push('<span style="color:'+col+'">trasf. '+t.min+'m + attesa '+(gap>=0?fmtDur(gap):'⛔ -'+fmtDur(-gap))+'</span>');
      }
    }
    var g=garageInfo(mine);
    if(g&&g.min>0)parts.push('<span style="color:var(--blu)">🏠 rientro '+g.min+'m → in garage <b>'+fmtMin(g.at)+'</b></span>');
    return '<div class="tltesto">'+parts.join(' · ')+'</div>';
  }

  var liberi=[];
  h+='<div class="sez">Autisti</div>';
  statusOf(DATA.autisti,function(sv){return sv.autista;}).forEach(function(st){
    if(!st.mine.length){
      if(!st.item.esclusoMotivo&&isOperativo(st.item))liberi.push(st.item.nome);
      return;
    }
    var c=colorOf(st.item.nome);
    h+='<div class="tl" style="border-left:4px solid '+c+'">'
      +'<div class="riga"><div class="nome"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:'+c+';margin-right:5px"></span>'+esc(st.item.nome)+'</div><div class="st">'+statusChip(st)+'</div></div>'
      +bars(st.mine,c)+riepilogo(st.mine)+'</div>';
  });

   Sulla plancia un servizio di 45 minuti può essere largo 12 px: toccandolo
   si arma per l'assegnazione e insieme mostra questa scheda ridotta, così si
   sa sempre chi si sta spostando. Non scrive niente: legge e basta. */
function plNodoDi(id) {

}
function plCardApri() { if (PL_ARM) plApriServizio(PL_ARM); }
/* Togliere è un gesto a sé: capita di dover liberare il mezzo tenendo l'autista (il van
   serve altrove, il giro no) o di togliere l'autista lasciando il mezzo fermo dov'è.
   cosa = 'veicolo' | 'autista' | 'tutti'. Come ogni altra mossa non scrive sul foglio:
   finisce in PEND e si salva dalla barra gialla. */
function plStacca(cosa) {
  plCon(function () {
    var s = plArmato();
    if (!s) return;
    var vei = cosa === 'autista' ? (s.veicolo || '') : '';
    var aut = cosa === 'veicolo' ? (s.autista || '') : '';
    if ((s.veicolo || '') === vei && (s.autista || '') === aut) { PL_ARM = null; render(); return; }
    PEND[s.id] = { autista: aut, veicolo: vei };
    s.veicolo = vei; s.autista = aut;
    if (s.orig) { s.orig.veicolo = vei; s.orig.autista = aut; }
    PL_ARM = null;

    toast('🕐 ' + (cosa === 'veicolo' ? 'mezzo tolto' : (cosa === 'autista' ? 'autista tolto' : 'mezzo e autista tolti'))
      + ' da ' + (s.nome || s.da) + ' — salva dalla barra in alto');
  });
}

/* ---- messaggino che segue il dito mentre trascini ---- */
function plMsg(x, y, testo, errore) {
  var m = document.getElementById('plmsg');
  if (!m) { m = document.createElement('div'); m.id = 'plmsg'; document.body.appendChild(m); }
  m.textContent = testo;
